  }

  /* ── Free water vs. the protein collision shells ─────────────────────────────────────────────
     The same star-shaped radius field the dev-mode shells draw is packed into a float texture, one
     NLAT-row block per shell, and the water vertex shader pushes any molecule whose centre falls
     inside a shell back out to its surface along the bearing it entered on. It is a pure function of
     the ballistic position, so it needs no state and no per-frame upload — which is the only way it
     can run for 20000 molecules — and the JS mirror below reproduces it bit-for-bit so the crisp-zone
     orbitals stay locked to their own atoms.
     Being stateless it EXCLUDES rather than bounces: water slides around a protein instead of
     rebounding off it. A real reflection would need per-molecule velocity state on the CPU. */
  const NSH = gHulls.length;
  let gShellTex = null;
  const gShellCen = new Float32Array(Math.max(1, NSH)*3);    // shell centre in WORLD space
  const gShellRot = new Float32Array(Math.max(1, NSH)*9);    // world → model rotation (gModelXform is rigid)
  const gShellR2  = new Float32Array(Math.max(1, NSH));      // furthest reach², for the early-out
  if(NSH){
    const tex = new Float32Array(SH_LON * SH_LAT * NSH * 4);
    for(let s=0;s<NSH;s++){ const D=gHulls[s].D;
      for(let li=0; li<SH_LAT; li++) for(let lo=0; lo<SH_LON; lo++)
        tex[((s*SH_LAT + li)*SH_LON + lo)*4] = D[li*SH_LON + lo];
    }
    gShellTex = new BABYLON.RawTexture(tex, SH_LON, SH_LAT*NSH, BABYLON.Constants.TEXTUREFORMAT_RGBA,
      scene, false, false, BABYLON.Texture.NEAREST_SAMPLINGMODE, BABYLON.Constants.TEXTURETYPE_FLOAT);
    gShellTex.wrapU = gShellTex.wrapV = BABYLON.Texture.CLAMP_ADDRESSMODE;
    const _sm = new BABYLON.Matrix(), _si = new BABYLON.Matrix(), _sc = new BABYLON.Vector3();
    const placeShells = () => {
      for(let s=0;s<NSH;s++){ const h=gHulls[s];
        BABYLON.Matrix.FromArrayToRef(gModelXform, h.mi*16, _sm);
        BABYLON.Vector3.TransformCoordinatesToRef(h.c, _sm, _sc);
        gShellCen[s*3]=_sc.x; gShellCen[s*3+1]=_sc.y; gShellCen[s*3+2]=_sc.z;
        _sm.invertToRef(_si); const q=_si.m, o=s*9;
        gShellRot[o]=q[0]; gShellRot[o+1]=q[1]; gShellRot[o+2]=q[2];
        gShellRot[o+3]=q[4]; gShellRot[o+4]=q[5]; gShellRot[o+5]=q[6];
        gShellRot[o+6]=q[8]; gShellRot[o+7]=q[9]; gShellRot[o+8]=q[10];
        gShellR2[s]=h.maxR*h.maxR;
      }
    };
    placeShells();
    scene.onBeforeRenderObservable.add(placeShells);   // a dragged or flattened model carries its shell
  }
  /* CPU mirror of the shader's repel(): same bearing rounding, same push. Mutates p in place. */
  const repelShells = p => {
    for(let s=0;s<NSH;s++){
      const dx=p[0]-gShellCen[s*3], dy=p[1]-gShellCen[s*3+1], dz=p[2]-gShellCen[s*3+2];
      const r2=dx*dx+dy*dy+dz*dz;
      if(r2 >= gShellR2[s] || r2 < 1e-8) continue;
      const r=Math.sqrt(r2), o=s*9;
      const lx=gShellRot[o]*dx+gShellRot[o+3]*dy+gShellRot[o+6]*dz;
      const ly=gShellRot[o+1]*dx+gShellRot[o+4]*dy+gShellRot[o+7]*dz;
      const lz=gShellRot[o+2]*dx+gShellRot[o+5]*dy+gShellRot[o+8]*dz;
      const li=Math.min(SH_LAT-1, Math.max(0, Math.round(Math.acos(Math.max(-1,Math.min(1,lz/r)))/Math.PI*(SH_LAT-1))));
      let lo=Math.floor((Math.atan2(ly,lx)+Math.PI)/(2*Math.PI)*SH_LON); lo=((lo%SH_LON)+SH_LON)%SH_LON;
      const Rs=gHulls[s].D[li*SH_LON+lo];
      if(r < Rs){ const k=Rs/r - 1.0; p[0]+=dx*k; p[1]+=dy*k; p[2]+=dz*k; }
    }
  };

  /* ── Aromatic delocalised-π tori: two translucent rings (above/below each aromatic
     ring plane) with a bright arc orbiting them (the ring current). One thin-instanced
     torus mesh; the shader shows it only inside the reveal-bubble. */
  const ringCells = [];   // per-bucket aromatic-ring meshes, culled by camera distance in the frame loop
  if(RINGS.length){
    const perpV = n => { const a = Math.abs(n[0])<0.9?[1,0,0]:[0,1,0]; const c=crs(n,a); const l=Math.hypot(c[0],c[1],c[2])||1; return [c[0]/l,c[1]/l,c[2]/l]; };
    const ringMat = new BABYLON.ShaderMaterial('ringMat', scene, 'ring', {
      attributes:['position','normal','rcol','modelId','world0','world1','world2','world3'],
      uniforms:['view','projection','bubbleR','uRingT','uT','fogColor','fogStart','fogEnd','modelXform','macroXform','macroCenter'] });
    ringMat.setFloat('bubbleR', BUBBLE_R); ringMat.alpha=0.75; ringMat.disableDepthWrite=true; ringMat.backFaceCulling=true;
    ringMat.onBindObservable.add(()=>{ const eff=ringMat.getEffect(); if(!eff)return;
      eff.setMatrices('modelXform', gModelXform); eff.setMatrix('macroXform', macroGizmoNode.getWorldMatrix()); eff.setVector3('macroCenter', psiiCenter);
      eff.setFloat('uT',gWaveT); eff.setFloat('uRingT',gWaveT*2.2);
      eff.setColor3('fogColor',scene.fogColor); eff.setFloat('fogStart',scene.fogStart); eff.setFloat('fogEnd',scene.fogEnd); });
    const torusTpl = BABYLON.MeshBuilder.CreateTorus('ringsTpl', {diameter:2, thickness:0.35, tessellation:14}, scene);   // 2× narrower tube
    torusTpl.material=ringMat; torusTpl.isPickable=false; torusTpl.setEnabled(false);   // template only — the per-bucket clones share its geometry
    const rmat = new Float32Array(RINGS.length*2*16), rcol = new Float32Array(RINGS.length*2*3), rmid = new Float32Array(RINGS.length*2); let ii=0;
    for(const rg of RINGS){ const N=[rg.nx,rg.ny,rg.nz], T=perpV(N), B=crs(N,T), R=rg.R, c=rg.col;
      for(const dw of [0.5,-0.5]){ const o=ii*16;
        rmat[o]=T[0]*R; rmat[o+1]=T[1]*R; rmat[o+2]=T[2]*R; rmat[o+3]=0;
        rmat[o+4]=N[0]*R; rmat[o+5]=N[1]*R; rmat[o+6]=N[2]*R; rmat[o+7]=0;
        rmat[o+8]=B[0]*R; rmat[o+9]=B[1]*R; rmat[o+10]=B[2]*R; rmat[o+11]=0;
        rmat[o+12]=rg.cx+dw*N[0]; rmat[o+13]=rg.cy+dw*N[1]; rmat[o+14]=rg.cz+dw*N[2]; rmat[o+15]=1;
        rcol[ii*3]=c[0]; rcol[ii*3+1]=c[1]; rcol[ii*3+2]=c[2]; rmid[ii]=rg.mi|0; ii++; }
    }

    /* The unhybridised p-orbitals (perpendicular to the ring on each carbon) that
       overlap side-on to form the delocalised π. Drawn with the orbital shader. */
    const pMat = new BABYLON.ShaderMaterial('aromPMat', scene, 'orb', {
      attributes:['position','normal','ocol','ocen','oid','modelId','world0','world1','world2','world3'],

    'ATP': () => { const g=bondL('P','O')*2.4; return [...phosphate(0,0,0), ...phosphate(g,0,0), ...phosphate(g*2,0,0), ...ringAt(g*3.05,0,bondL('C','C')*1.1,['C','O','C','C','C']), ...ringAt(g*4.2,0,bondL('C','N')*1.15,['N','C','N','C','N','C'])]; },
    'NADPH': () => { const g=bondL('P','O')*2.4; return [...phosphate(0,0,0), ...ringAt(g*1.3,0,bondL('C','N')*1.15,['N','C','C','C','C','C']), ...ringAt(g*2.6,0,bondL('C','N')*1.15,['N','C','N','C','N','C']), ...ringAt(g*1.95,g*1.15,bondL('C','C')*1.1,['C','O','C','C','C'])]; },
  };
  const gMolecules = [];   // {name, refs:[spawned atom…], off:[[dx,dy,dz]…], cx,cy, vx,vy, ang, av}
  const spawnMolecule = (name, x, y) => {
    const build = MOL_BUILD[name]; if(!build) return false;
    const local = build();
    let mx=0,my=0,mz=0; for(const a of local){ mx+=a.x; my+=a.y; mz+=a.z; } mx/=local.length; my/=local.length; mz/=local.length;
    const off = local.map(a=>[a.x-mx, a.y-my, a.z-mz]);
    const refs = [];
    const mol = { name, refs, off, cx:x, cy:y, vx:0, vy:0, ang:0, av:0 };   // spawns AT REST — press M (with it selected) to start it moving, S to stop
    for(let i=0;i<local.length;i++){ const s={sym:local[i].sym, x:x+off[i][0], y:y+off[i][1], z:FLOOR_Z+off[i][2], id:gSpawnId++, mol:true, molRef:mol}; spawned.push(s); refs.push(s); }
    gMolecules.push(mol);
    rebuildSpawn(); return true;
  };
  const removeMolecule = m => { gSelMol.delete(m); for(const r of m.refs){ const i=spawned.indexOf(r); if(i>=0) spawned.splice(i,1); } const j=gMolecules.indexOf(m); if(j>=0) gMolecules.splice(j,1); };
  // Per-frame: drift + tumble + wall-bounce within the scene bounds; a water molecule splits at an OEC site.
  { const _oc={x:0,y:0,z:0}; scene.onBeforeRenderObservable.add(() => {
    if(!gMolecules.length) return;
    const dt = Math.min(50, scene.getEngine().getDeltaTime())/1000, x0=gMiX, x1=gMaX, y0=gMiY, y1=gMaY;
    let dirty = false;
    for(let mi=gMolecules.length-1; mi>=0; mi--){ const m=gMolecules[mi];
      if(!gMB3D){   // when the ported sim (gMB3D) is driving, IT sets cx/cy/ang — skip the legacy drift/move-order/bounce
        if(m.mtx !== undefined){   // right-click move order → steer straight to the target, then stop exactly on it
          const dx=m.mtx-m.cx, dy=m.mty-m.cy, d=Math.hypot(dx,dy), step=85*dt*gSpeed;
          if(d <= Math.max(step, 0.5)){ m.cx=m.mtx; m.cy=m.mty; m.vx=0; m.vy=0; m.mtx=undefined; }   // arrived → snap + halt
          else { m.vx=dx/d*85; m.vy=dy/d*85; } }
        m.cx += m.vx*dt*gSpeed; m.cy += m.vy*dt*gSpeed; m.ang += m.av*dt*gSpeed;   // speed slider scales the drift + tumble
        if(m.cx<x0){ m.cx=x0; m.vx=Math.abs(m.vx); } else if(m.cx>x1){ m.cx=x1; m.vx=-Math.abs(m.vx); }
        if(m.cy<y0){ m.cy=y0; m.vy=Math.abs(m.vy); } else if(m.cy>y1){ m.cy=y1; m.vy=-Math.abs(m.vy); }
      }
      const c=Math.cos(m.ang), s=Math.sin(m.ang);   // apply ref positions from cx/cy/ang (set by drift OR by the ported sim)
      for(let i=0;i<m.refs.length;i++){ const o=m.off[i], r=m.refs[i]; r.x=m.cx+o[0]*c-o[1]*s; r.y=m.cy+o[0]*s+o[1]*c; r.z=FLOOR_Z+o[2]; }
      if(!gMB3D && m.name==='H₂O' && gReactSites){ let hit=false;
        for(let gi=0; gi<gReactSites.count; gi++){ if(gReactSites.typeOf(gi)!==1) continue; gReactSites.siteWorld(gi,_oc);
          const rr=gReactSites.radiusOf(gi)+5, dx=m.cx-_oc.x, dy=m.cy-_oc.y, dz=FLOOR_Z-_oc.z;
          if(dx*dx+dy*dy+dz*dz < rr*rr){ hit=true; break; } }
        if(hit){ removeMolecule(m); splitAt(m.cx, m.cy, FLOOR_Z); dirty=true; continue; } }
      dirty = true;
    }
    if(dirty) rebuildSpawn();
  }); }

  /* ═══════════════════════════════════════════════════════════════════════════════════════════════
     MoleculeBody3D — port of ProjectMPB's shared molecule brain (pull / bind / release / excite),
     faithful to MoleculeBody2D.gd + MoleculeBody2D_Logic_Spec.md. 2.5D on the floor plane (world X,Y at
     Z=FLOOR_Z). Gated behind gMB3D (OFF by default) while it is built up in the §19 order — when the tick
     is disabled it does nothing, so the existing sim is untouched.
       PART 1 (here): data model + group registries + possible_interactions + movement/steering/bounce.
       NEXT: overlap sensing → pull → bind → release → excitation → cascades → per-type hooks → entity wiring.
     ═══════════════════════════════════════════════════════════════════════════════════════════════ */
  let gMB3D = false;                       // master toggle for the ported simulation (dev-only for now)
  const MB = (() => {
    // §5 the interaction rulebook — who can bind what (verbatim from possible_interactions).
    const possibleInteractions = {
      OEC:['electron','H2O'], P680:['electron'], P700:['electron'], pheophytin:['electron'],
      plastoquinone_A:['electron'], plastoquinone_B:['electron','proton'],
      photosystem_II:['plastoquinone_B','VDE'], cytochrome_b6f:['plastoquinone_B','plastocyanin'],
      heme:['electron'], plastocyanin:['electron'], iron_sulfur_cluster_inside_cytochrome_b6f:['electron'],
      photosystem_I:['plastocyanin'], chlorophyll_A_PSI:['electron'], phylloquinone:['electron'],
      iron_sulfur_cluster_inside_photosystem_I:['electron'], RuBisCO:['CO2','NADP','ATP'],
      ferredoxin:['electron'], FNR:['ferredoxin','NADP','electron'], NADP:['electron','proton'],
      'ATP-synthase':['ADP','phosphate','proton'], tyrosine:['electron','O2'], 'Fe3+':['electron'],
      'NDH-1':['ferredoxin','plastoquinone_B'],
    };
    const canBind = (complexName, bodyName) => { const l=possibleInteractions[complexName]; return !!l && l.indexOf(bodyName)>=0; };
    // §4.2 groups/tags — per-object Set<string> plus a global registry Map<tag, Set<mol>>.
    const groups = new Map(), all = new Set();
    const inGroup = (m,g) => m.tags.has(g);
    const addToGroup = (m,g) => { m.tags.add(g); let s=groups.get(g); if(!s){ s=new Set(); groups.set(g,s); } s.add(m); };
    const removeFromGroup = (m,g) => { m.tags.delete(g); const s=groups.get(g); if(s) s.delete(m); };
    const nodesInGroup = g => groups.get(g) || new Set();
    // §4.3 collision categories: FREE (roaming) vs IN_TRANSIT (being pulled / bound), + per-pair ignore sets.
    const CAT = { FREE:1, IN_TRANSIT:2 };
    const allowOverlap = (a,b) => { a.ignore.add(b); b.ignore.add(a); };
    // §2/§3 a molecule agent. `mesh` is the driven entity's visual (assigned by the entity binder later).
    const make = (name, x, y, cfg={}) => {
      const m = { name, tags:new Set(), flags:{},
        x, y, rot:cfg.rot||0, dir:{x:0,y:-1}, speed:cfg.speed ?? 0, category:CAT.FREE,
        hardTarget:null, softTarget:null, boundTo:cfg.boundTo||null,
        placeInChain:cfg.placeInChain||0, energyLevel:0,
        pulledBodies:new Set(), overlapping:[], ignore:new Set(),
        bindSites:cfg.bindSites||[], parentComplex:cfg.parentComplex||null, isSlot:!!cfg.isSlot,
        occupied:false, active:true, alive:true, rotDir:1, excited:false, excitable:!!cfg.excitable, damaged:false, visible:cfg.visible ?? true,
        radius:cfg.radius ?? 8, touchR:cfg.touchR ?? ((cfg.radius ?? 8)+2), nearbyR:cfg.nearbyR ?? 90,
        mesh:cfg.mesh||null, hooks:cfg.hooks||{}, _touchSet:new Set(), _nearbySet:new Set() };
      addToGroup(m, name); addToGroup(m, 'MoleculeBody2D');
      return m;
    };
    const spawnFree = (name, x, y, cfg={}) => { const m = make(name, x, y, cfg); all.add(m); if(m.bindSites) for(const s of m.bindSites) all.add(s); return m; };
    const kill = m => { if(!m.alive) return; m.alive=false; all.delete(m); for(const g of [...m.tags]) removeFromGroup(m,g);
      for(const o of m.ignore) o.ignore.delete(m); if(m.mesh && m._ownMesh && m.mesh.dispose) m.mesh.dispose(); };
    // §7 movement + steering + bounce (free, non-slot, speeded molecules).
    const norm = v => { const l=Math.hypot(v.x,v.y)||1; return {x:v.x/l, y:v.y/l}; };
    const lerp2 = (a,b,t) => ({x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t});
    const syncMesh = m => { if(m.mesh && m.mesh.position){ m.mesh.position.x=m.x; m.mesh.position.y=m.y; m.mesh.position.z=FLOOR_Z; }
      if(m._gmol){ m._gmol.cx=m.x; m._gmol.cy=m.y; m._gmol.ang=m.rot; } };   // drive the linked spawned molecule
    const step = (m, dt) => {
      if(m.isSlot || !m.speed) return;
      if(m.hardTarget){ const t=m.hardTarget; m.dir = norm(lerp2(m.dir, norm({x:t.x-m.x, y:t.y-m.y}), 0.5)); }              // §7.1 hard (aggressive)
      else if(m.softTarget){ const t=m.softTarget; m.dir = norm(lerp2(m.dir, norm({x:t.x-m.x, y:t.y-m.y}), 0.025)); }      // §7.2 soft (gentle)
      const vx=m.speed*m.dir.x, vy=m.speed*m.dir.y;                                                                        // §7.3 velocity
      const nx=m.x+vx*dt, ny=m.y+vy*dt; let hitN=null, hit=null;                                                           // §7.4 swept move vs FREE bodies
      for(const o of all){ if(o===m || o.isSlot || o.category!==CAT.FREE || m.category!==CAT.FREE) continue;
        if(m.ignore.has(o) || o.ignore.has(m)) continue;
        const rr=m.radius+o.radius, dx=nx-o.x, dy=ny-o.y, d2=dx*dx+dy*dy;
        if(d2 < rr*rr){ const d=Math.sqrt(d2)||1e-4; hitN={x:dx/d,y:dy/d}; hit=o; break; } }
      if(hit && (hit.speed==null || hit.speed<=m.speed)){                                                                  // §7.5 bounce (only off slower/equal colliders)
        const dot=m.dir.x*hitN.x+m.dir.y*hitN.y;
        m.dir = norm({x:m.dir.x-2*dot*hitN.x, y:m.dir.y-2*dot*hitN.y});
        const vn=norm({x:vx,y:vy}); m.x-=vn.x*2; m.y-=vn.y*2; m.rotDir*=-1;
      } else { m.x=nx; m.y=ny; }
      syncMesh(m);
    };
    // §16 per-type override hooks — virtual dispatch like a MoleculeBody subclass: a per-INSTANCE hook wins,
    // else the molecule TYPE's definition (moleculeSpec[name], see PER-MOLECULE DEFINITIONS), else the base
    // default (undefined = "no hook", i.e. Godot's stub).
    const hook = (m, name, ...a) => { const h = (m.hooks && m.hooks[name]) || (moleculeSpec[m.name] && moleculeSpec[m.name][name]); return h ? h(m, ...a) : undefined; };
    const isMolecule = b => b && b.tags && b.tags.has('MoleculeBody2D') && b.alive;
    const isAncestor = (m, body) => { let p = body.parentComplex; while(p){ if(p===m) return true; p=p.parentComplex; } return false; };
    const withinR = (a, b, r) => { const dx=a.x-b.x, dy=a.y-b.y; return dx*dx+dy*dy <= r*r; };
    const setCategory = (b, cat) => { b.category = cat; };
    const isWhite = m => m.isSlot ? m.occupied : m.active;          // §4.1 white = occupied (slot) / active (complex)
    const alive = m => m && m.alive;
    const lerpAngle = (a, b, t) => { let d = (b - a) % (2*Math.PI); if(d < -Math.PI) d += 2*Math.PI; else if(d > Math.PI) d -= 2*Math.PI; return a + d*t; };
    const angDiff = (a, b) => { let d = (b - a) % (2*Math.PI); if(d < -Math.PI) d += 2*Math.PI; else if(d > Math.PI) d -= 2*Math.PI; return d; };
    const shockWave = m => {};                                      // §14 cosmetic — stub for now
    const _frameResolvers = [];                                     // §18 nextFrame() — resolves on the next tick
    const nextFrame = () => new Promise(r => _frameResolvers.push(r));
    const _delays = [];                                             // §18 delay(ms) — frame-based so it scales with the sim tick (not wall-clock)
    const delay = ms => new Promise(r => _delays.push({ frames: Math.max(1, Math.round(ms/16.6667)), resolve:r }));
    const advanceDelays = () => { for(let i=_delays.length-1;i>=0;i--) if(--_delays[i].frames <= 0){ const d=_delays.splice(i,1)[0]; d.resolve(); } };

    /* ── §9.1 BINDING_conditions(complex, body, slot) → the slot, or null.  With slot=null it is the PULL
       query ("is there ANY slot on me this body could bind?"). Shared by pulling AND binding. ── */
    const bindingConditions = (m, body, slot=null) => {
      if(!m.bindSites || !isWhite(m)) return null;                        // BindSites exist - I am active/white
      if(isAncestor(m, body)) return null;                               // I am not the body's ancestor
      if(!isMolecule(body)) return null;
      if(slot === null){                                                 // PULL path — find the first slot that can pull this body
        for(const s of m.bindSites){
          if(!withinR(s, body, s.nearbyR)) continue;                     // only the slot whose own Nearby overlaps the body
          if([...s.pulledBodies].some(b => b && b.alive && b !== body)) continue;   // one body per slot
          if(bindingConditions(m, body, s)) return s;
        }
        return null;
      }
      if(hook(m, 'bindingSpecialConditions', body, slot) === false) return null;   // §16 per-type gate (default true)
      if(body.isSlot) return null;                                       // body is not itself a slot
      if(!canBind(m.name, body.name)) return null;                       // both listed in possible_interactions
      if(body.flags.exiting) return null;                                // body not freshly released
      if(slot.flags.binding_ongoing || body.flags.binding_ongoing) return null;
      if(slot.name !== body.name) return null;                           // right slot for this type
      if(slot.visible === false) return null;
      if(slot.occupied) return null;                                     // slot must be empty (darkened)
      return slot;
    };
    // §8.1 PULLING_conditions — body not already committed, then defer to the pull query.
    const pullingConditions = (m, body) => (isMolecule(body) && body.hardTarget == null) ? bindingConditions(m, body) : null;
    // §8.2 try_PULLING — move the body onto the in-transit category, register it on the slot, steer it in.
    const tryPulling = (m, body) => {
      const slot = pullingConditions(m, body);
      if(slot){ setCategory(body, CAT.IN_TRANSIT); slot.pulledBodies.add(body); body.hardTarget = slot; body.flags.repelFrom = null; hook(m,'pullingSpecialActions', body); }
      else repelling(m, body);
    };
    // §8.3 repelling — nudge a latecomer away from a slot of mine it is drifting to that is already full.
    const repelling = (m, body) => {
      if(isMolecule(body) && body.softTarget && body.softTarget.boundTo === m && body.softTarget.occupied && m.active)
        body.flags.repelFrom = m;   // step() nudges it away each frame while still in range (§8.3 while-loop)
    };

    /* ── §9.2 try_BINDING(complex, body, slot) — the glide-in animation + consume. ── */
    const consumeIntoSlot = (body, slot) => {                               // §9.2 ACTIONS 6-10 "pass along attributes"
      const dest = new Map((slot.bindSites || []).map(s => [s.name, s]));   // name-matched sub-slots
      for(const item of (body.bindSites || [])){ const d = dest.get(item.name); if(!d) continue;
        d.occupied = item.occupied; d.excited = item.excited;
        if(inGroup(item, 'electron')) d.energyLevel = item.energyLevel;
        if(inGroup(item, 'followed')){ removeFromGroup(item, 'followed'); addToGroup(d, 'followed'); } }
      if(inGroup(body, 'electron')){ slot.energyLevel = body.energyLevel * 0.9; slot.excited = body.excited; shockWave(slot); }   // electron energy drops a tenth
      if(inGroup(body, 'followed')){ addToGroup(slot, 'followed'); removeFromGroup(body, 'followed'); }
      kill(body); slot.occupied = true; syncMesh(slot);                     // delete body, slot now white/occupied
    };
    let _cascadeDepth = 0;
    const cascadeAfterBind = (m, slot) => {                                 // §9.2 ACTIONS 16-19 / §17 re-pokes
      if(_cascadeDepth > 6) return;                                         // anti-freeze: don't let re-pokes recurse synchronously forever
      _cascadeDepth++;
      for(const b of [...slot._touchSet]) if(isMolecule(b)) whenBodyEntersTouchArea(b, b);
      for(const b of [...slot._nearbySet]) if(isMolecule(b)) whenBodyEntersNearbyArea(slot, b);
      for(const b of [...m._touchSet]) if(isMolecule(b) && b.bindSites){ const s2 = b.bindSites.find(x => x.name === m.name); if(s2 && withinR(s2, m, s2.touchR)) tryBinding(b, m, s2); }
      for(const b of [...m._nearbySet]) if(isMolecule(b)){ tryReleasing(b); tryExcitationTransferring(b); }
      _cascadeDepth--;
    };
    const tryBinding = async (m, body, slot) => {
      if(!bindingConditions(m, body, slot)) return;
      slot.flags.binding_ongoing = true; body.flags.binding_ongoing = true;   // guards
      body.collisionOff = true; body.speed_saved = body.speed; body.speed = 0; // disable body physics/collision
      let rate = 0, guard = 0;
      while(alive(body) && !slot.occupied && guard++ < 3000){                 // glide loop (§9.2 ACTION 5) — guard = anti-freeze cap
        const d = Math.max(Math.hypot(body.x - slot.x, body.y - slot.y), 1);
        rate = rate + (0.5 - rate) * (0.1 / d);
        body.x += (slot.x - body.x) * rate; body.y += (slot.y - body.y) * rate;
        body.rot = lerpAngle(body.rot, slot.rot, rate); syncMesh(body);
        if(Math.hypot(body.x - slot.x, body.y - slot.y) < 1 && Math.abs(angDiff(body.rot, slot.rot)) < 0.1) consumeIntoSlot(body, slot);
        await nextFrame();
      }
      slot.boundTo = m;                                                      // ACTION 12
      for(const o of [...slot.pulledBodies]) if(o && o.alive && o.hardTarget === slot) o.hardTarget = null;   // ACTION 12b free the slot
      slot.pulledBodies.clear();
      slot.flags.binding_ongoing = false;                                    // ACTION 13
      hook(m, 'checkSoftTarget'); hook(m, 'bindingSpecialActions', slot);    // ACTIONS 14-15
      cascadeAfterBind(m, slot);                                             // ACTIONS 16-19
    };
    /* ── §10 RELEASE — emit a bound molecule back into the world as a fresh free agent. ── */
    /* ══════════════════════════════════════════════════════════════════════════════════════════════
       PER-MOLECULE DEFINITIONS  —  one block per molecule type, mirroring ProjectMPB's per-molecule
       scripts (Scenes/Level_7_scenes_and_scripts/<Name>.gd). Everything GENERIC lives in the shared
       engine above (= the base MoleculeBody2D.gd). Each block here is the equivalent of a subclass:
       its numeric config (speed / radius / placeInChain / excitable — set by the .tscn scene in Godot)
       plus the handful of overridable hooks a molecule actually customises:
          ready                    ← _ready() extras (after super._ready)
          physicsProcess           ← _physics_process() extras (after super)
          checkSoftTarget          ← check_soft_target()
          pullingSpecialActions    ← PULLING_special_actions(body)
          bindingSpecialConditions ← BINDING_special_conditions(body, slot)   (return false = block)
          bindingSpecialActions    ← BINDING_special_actions(slot)
          releasingSpecialConditions ← RELEASING_special_conditions(name)     (return false = block)
          releasingSpecialActions  ← RELEASING_special_actions(body)
       Hooks are dispatched by type via hook()/hookAsync() (virtual-dispatch on molecule_name). A block
       may omit any hook — the engine then uses the base default (Godot's stub: `return true` / `pass`).
       ══════════════════════════════════════════════════════════════════════════════════════════════ */
    // OEC water-splitting (OEC.gd → try_to_remove_electron_from_water): H2O→OH→O over two extractions,
    // each ejecting one electron (into my electron slot) + one proton, and finally releasing an O.
    const oecSplitWater = (m) => {
      const eslot = (m.bindSites||[]).find(s => s.name === 'electron');
      const wslot = (m.bindSites||[]).find(s => s.name === 'H2O');
      if(!eslot || !wslot || !wslot.occupied || eslot.occupied) return;        // need bound water + an empty electron slot
      const psII = [...nodesInGroup('photosystem_II')];
      const tgt = psII.length ? psII[Math.floor(rnd01()*psII.length)] : null;  // soft target for the products (a PSII)
      m._waterState = m._waterState || 0;                                       // 0 = H2O, 1 = OH
      if(m._waterState === 0){ m._waterState = 1; }                             // H2O → OH (first extraction)
      else { m._waterState = 0;                                                 // OH → O: emit the oxygen atom, empty the slot
        const o = make('O', wslot.x, wslot.y, { speed: specOf('O').speed ?? 60, radius: specOf('O').radius ?? 6 });
        o.category = CAT.IN_TRANSIT; o.flags.exiting = true; if(tgt){ o.softTarget = tgt; o.dir = norm({x:tgt.x-o.x, y:tgt.y-o.y}); }
        all.add(o); hook(o,'ready'); wslot.occupied = false; syncMesh(wslot); }
      const e = make('electron', wslot.x, wslot.y, { speed: specOf('electron').speed ?? 90, radius: specOf('electron').radius ?? 5 });
      e.category = CAT.IN_TRANSIT; e.hardTarget = eslot; eslot.pulledBodies.add(e); all.add(e); hook(e,'ready');   // electron flies into my electron slot
      const p = make('proton', wslot.x, wslot.y, { speed: specOf('proton').speed ?? 70, radius: specOf('proton').radius ?? 4 });
      p.category = CAT.IN_TRANSIT; p.flags.exiting = true; if(tgt) p.softTarget = tgt; p.dir = norm({x: rnd01()*2-1, y: 1}); all.add(p); hook(p,'ready');
    };
    const moleculeSpec = {
      // ── H2O.gd ── drifts to a random OEC's water slot
      H2O: { speed:50, radius:6,
        checkSoftTarget(m){ const oec=[...nodesInGroup('OEC')]; if(!oec.length) return; const s=(oec[Math.floor(rnd01()*oec.length)].bindSites||[]).find(x=>x.name==='H2O'); if(s) m.softTarget=s; } },
      // ── electron.gd ── an orphaned electron (no target, not bound, not mid-handshake) dies
      electron: { speed:90, radius:5,
        physicsProcess(m){ if(!m.isSlot && !m.hardTarget && !m.boundTo && !m.flags.binding_ongoing && !m.flags.exiting) kill(m); } },
      // ── proton.gd ── all special hooks are stubs
      proton: { speed:70, radius:4 },
      // ── O.gd ── on spawn, pair up with the nearest other O (mutual hard target → they meet and fuse to O2 in the base)

  /* ── Render an MDL MOL file (2D coords + explicit H + bond orders) as a full structural formula:

  const molToSVG = text => {
    const L = text.split(/\r?\n/); if(L.length < 5) return '';
    const na = parseInt(L[3].slice(0,3),10), nb = parseInt(L[3].slice(3,6),10); if(!(na>0)) return '';
    const At=[], bonds=[];
    for(let i=0;i<na;i++){ const ln=L[4+i]; At.push({ x:parseFloat(ln.slice(0,10)), y:parseFloat(ln.slice(10,20)), sym:(ln.slice(31,34)||'').trim() }); }
    for(let i=0;i<nb;i++){ const ln=L[4+na+i]; bonds.push([parseInt(ln.slice(0,3),10)-1, parseInt(ln.slice(3,6),10)-1, parseInt(ln.slice(6,9),10)||1]); }
    let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
    for(const a of At){ mnx=Math.min(mnx,a.x); mxx=Math.max(mxx,a.x); mny=Math.min(mny,a.y); mxy=Math.max(mxy,a.y); }
    let bl=0; for(const [i,j] of bonds) bl+=Math.hypot(At[i].x-At[j].x, At[i].y-At[j].y); bl=(bl/Math.max(1,bonds.length))||1;
    const s=19/bl, pad=16, W=(mxx-mnx)*s+2*pad, H=(mxy-mny)*s+2*pad;   // ~19px per bond in viewBox units (SVG scales to fit width)
    const PX=a=>pad+(a.x-mnx)*s, PY=a=>pad+(mxy-a.y)*s;               // flip Y (MOL is y-up, SVG is y-down)
    const eArr=sym=>(ELEM[(sym||'').toUpperCase()]||ELEM.FB).c;       // EXACT element colour (same table the orbitals use)
    const rgbOf=c=>'rgb('+Math.round(c[0]*255)+','+Math.round(c[1]*255)+','+Math.round(c[2]*255)+')';
    const ink=(getComputedStyle(document.body).getPropertyValue('--ink')||'#4a3320').trim();
    const seg=(x1,y1,x2,y2)=>'<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="'+ink+'" stroke-width="1.3"/>';
    let sv='<svg viewBox="0 0 '+W.toFixed(0)+' '+H.toFixed(0)+'" width="100%" style="display:block">';   // width:100% → fits the panel
    for(const [i,j,ord] of bonds){ const x1=PX(At[i]),y1=PY(At[i]),x2=PX(At[j]),y2=PY(At[j]),dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
      if(ord===2){ const o=2.3; sv+=seg(x1+nx*o,y1+ny*o,x2+nx*o,y2+ny*o)+seg(x1-nx*o,y1-ny*o,x2-nx*o,y2-ny*o); }
      else if(ord===3){ const o=2.7; sv+=seg(x1,y1,x2,y2)+seg(x1+nx*o,y1+ny*o,x2+nx*o,y2+ny*o)+seg(x1-nx*o,y1-ny*o,x2-nx*o,y2-ny*o); }
      else sv+=seg(x1,y1,x2,y2); }
    for(const a of At){ const c=eArr(a.sym), col=rgbOf(c), lum=0.299*c[0]+0.587*c[1]+0.114*c[2], tcol=lum>0.6?'#1a1a1a':'#ffffff', x=PX(a).toFixed(1), y=PY(a).toFixed(1);
      sv+='<circle cx="'+x+'" cy="'+y+'" r="7" fill="'+col+'" stroke="'+ink+'" stroke-width="0.5"/>'   // SOLID element colour, like the orbital spheres
        + '<text x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="central" font-size="8.5" font-weight="bold" fill="'+tcol+'">'+(a.sym||'?')+'</text>'; }
    return sv+'</svg>';

  updateCofInfo = gi => {

  const rgbCss = c => 'rgb('+Math.round(c[0]*255)+','+Math.round(c[1]*255)+','+Math.round(c[2]*255)+')';
  const orbShapeSVG = (oid, fill) => {
    const stroke = '#4a3320', sw = 2;
    const lobe = (cx,cy,rx,ry) => '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'"/>';
    let inner;

      inner = lobe(20,31,4.6,6) + lobe(20,13,9,12);

      const type = Math.floor((oid % 100)/10);

          const camXR = xr.baseExperience.camera;
          const step = BASE * (1 + 5 * Math.max(gripState.left, gripState.right));   // grip → up to 6×
          // Right stick = FLY toward where the headset looks (pitch INCLUDED → look up & push to ascend).
          if (rightStick) {
            const ax = rightStick.axes;
            if (Math.abs(ax.x) > DEAD || Math.abs(ax.y) > DEAD) {
              camXR.getDirectionToRef(BABYLON.Axis.Z, fwd);   // full gaze direction (no y-lock → free flight)
              camXR.getDirectionToRef(BABYLON.Axis.X, rgt);
              camXR.position.addInPlace(fwd.scale(-ax.y * step));   // stick up = forward (fly up when looking up)
              camXR.position.addInPlace(rgt.scale( ax.x * step));   // strafe
            }
          }
          // Left stick Y = straight up / down (rotation X is handled by the built-in feature).
          if (leftStick && Math.abs(leftStick.axes.y) > DEAD) {
            camXR.position.addInPlace(UP.scale(-leftStick.axes.y * step));   // push up = rise
          }
        });
      }
    }
  } catch (e) { console.warn('WebXR unavailable:', e && e.message); }

  // ── Performance note: the SAFE global flags are set up front (engine.enableOfflineSupport=false,
  //    scene.skipPointerMovePicking=true). We deliberately do NOT use scene.freezeActiveMeshes()
  //    (the cull loop enables/disables cells every frame), material.freeze() (shader uniforms are pushed
  //    every frame via onBind), scene.blockMaterialDirtyMechanism (it stalled late vdW-shader compilation
  //    → blank scene), or freezeWorldMatrix() on the cells — every one of those breaks this scene's
  //    dynamic culling / deferred shader compilation.
  /* Frame cap. Above this the extra frames buy nothing visible and cost power and heat, and on a
     high-refresh panel the scene would otherwise run as fast as the GPU allows. Babylon's own delta
     time keeps accumulating across the skipped frames, so the molecules and the wave clock advance at
     exactly the same rate - capping the frame rate does not slow the scene down. */
  const FPS_CAP = 120, FRAME_MS = 1000/FPS_CAP;
  let _lastFrameAt = 0;
  engine.runRenderLoop(() => {
    const now = performance.now();
    if(now - _lastFrameAt < FRAME_MS - 0.5) return;
    _lastFrameAt = now;
    scene.render();
  });
  window.addEventListener('resize', () => engine.resize());

  /* Build EVERYTHING before the loading screen lifts, rather than streaming it in behind the user's back.
     The membrane and the atomic detail each create thousands of meshes and upload their instance buffers,
     and doing that across live frames is what made the scene stutter while flying — the frame itself
     renders in under 3 ms, so the hitching was never the renderer, it was the build competing with it.
     Waiting here is the deliberate trade: a longer load for a scene that is smooth once you are in it. */
  /* From here on the complexes are built and drawable - only the membrane and the atom detail remain,
     and both fill in while the scene is running. So let people in. The build competes with the frame
     for the main thread, so it is choppier this way than waiting, but that is a choice to offer rather
     than make for them. */
  { const eb = document.getElementById('load-enter');
    if(eb){ eb.hidden = false;
      eb.addEventListener('click', () => { document.getElementById('overlay').classList.add('gone'); }, {once:true}); } }
  try {
    if(buildMembrane){ setLbl('Rakennetaan kalvoa…'); setBar(0.55); await buildMembrane(); }
    if(buildDetail){ setLbl('Rakennetaan atomeja…'); setBar(0.75); await buildDetail(); }
  } catch(err){ console.warn('background build failed:', err); }

  /* Now pre-compile everything that exists — including the membrane materials, which did not exist
     earlier. Each distinct material is compiled against a mesh that actually uses it, the far-LOD twins
     explicitly (the culler only assigns those later), then a few real frames are rendered so the
     post-process chain and the render targets compile too. Nothing should have to compile mid-flight. */
  { setLbl('Esikäännetään varjostimia…'); setBar(0.90);
    const seen = new Set();
    for(const m of scene.meshes){
      const mat = m.material;
      if(!mat || seen.has(mat.uniqueId)) continue;
      seen.add(mat.uniqueId);
      try { mat.forceCompilation(m); } catch(_){}
    }
    const pm = scene.meshes.find(m => /^cs\d/.test(m.name));
    const lm = scene.meshes.find(m => m.name.startsWith('lipSp'));
    if(pm){ try { vdwFarMat.forceCompilation(pm); } catch(_){} }
    if(lm){ try { vdwStaticFarMat.forceCompilation(lm); } catch(_){} }
    for(let i=0;i<3;i++){ try { scene.render(); } catch(_){} }
    /* Compiling the materials is not enough: each MESH also pays a one-off cost the first time it is
       actually drawn (its vertex-array and instance-buffer bindings are created then). With thousands of
       cells that lands as a stall the moment a lot of geometry swings into view at once — measured as a
       230 ms frame when pulling back. So draw every mesh once here, then restore what was enabled. */
    setLbl('Lämmitetään puskureita…'); setBar(0.95);
    const wasOn = scene.meshes.map(m => m.isEnabled());
    for(const m of scene.meshes){ try { m.setEnabled(true); } catch(_){} }
    engine.setColorWrite(false);   // the bindings get created either way - this just keeps the frame from flashing everything if someone is already in
    for(let i=0;i<2;i++){ try { scene.render(); } catch(_){} }
    engine.setColorWrite(true);
    scene.meshes.forEach((m, i) => { try { m.setEnabled(wasOn[i]); } catch(_){} });
    try { scene.render(); } catch(_){}
  }
  // Apply the dev-only visibility ONCE now that everything it touches exists (minimap, cheatsheet,
  // floor sheet, read-outs). It used to run only on toggle, so all of those started out visible.
  try { applyDevMode(); } catch(_){}
  setBar(1); setLbl('Valmis');
  document.getElementById('overlay').classList.add('gone');
}

/* ── Auto-load PSII on page load (no prompt) ───────────────────────────── */
run().catch(err => {
  console.error(err);
  setLbl('Virhe: ' + err.message);
});
</script>
</body>
</html>
