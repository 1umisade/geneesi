html,body{width:100%;height:100%;overflow:hidden;background:#0e2215}   /* static dark green (the scene draws its own dark-green bg on top) */

html.panning, html.panning *{cursor:none !important}   /* edge-panning → the rotated arrow.png sprite replaces the system cursor */
/* ── Solukko palette: dark brown, beige/paper, light green/sage — cartoony & round ── */
:root{
  --paper:#f2e6c9; --paper2:#e7d4ac; --brown:#4a3320; --ink:#3a2716;
  --sage:#a3b881; --sage2:#82a058; --sageink:#2f3d1c;
}
body.dark-mode{
  --paper:#3a2c1c; --paper2:#2d2113; --brown:#7c5c39; --ink:#f0e2c4;
  --sage:#88a35f; --sage2:#a6bd7d; --sageink:#f1f5e2;

/* fixed, not absolute: absolute resolves inset:0 against the DOCUMENT, and while the canvas is still
   being sized the document is larger than the window — so the overlay centred itself in that bigger
   box and the loading screen drifted to the bottom-right of the visible page. */
#overlay{position:fixed;inset:0;z-index:20;display:flex;
  align-items:center;justify-content:center;background:#f2e6c9;transition:opacity .8s}
#overlay.gone{opacity:0;pointer-events:none}
.ptr{width:280px;height:10px;background:#e7d4ac;border:2.5px solid #4a3320;border-radius:99px;overflow:hidden}
.pfil{height:100%;width:100%;background:#82a058;border-radius:99px;
  transform:scaleX(0);transform-origin:left center;transition:transform .3s linear}
/* ── Loading screen: sleeping Mona (from the Solukko project) + real progress label + bar ── */
.loading-inner{display:flex;flex-direction:column;align-items:center;gap:18px}
.load-enter{font:15px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#4a3320;background:#e7d4ac;
  border:2.5px solid #4a3320;border-radius:999px;padding:9px 22px;cursor:pointer;margin-top:4px}
.load-enter:hover{background:#82a058;color:#f2e6c9}
.loading-mona-wrap{position:relative;width:120px;height:120px}
.loading-mona{width:120px;height:120px;object-fit:contain;image-rendering:auto;
  animation:loadingSleep 3.2s ease-in-out infinite}
@keyframes loadingSleep{0%,100%{transform:scale(1) rotate(-1.5deg)}50%{transform:scale(1.05) rotate(1.5deg)}}
.loading-zzz{position:absolute;top:-50px;right:-6px;width:64px;height:100px;pointer-events:none;overflow:visible}
.loading-zzz span{position:absolute;left:0;bottom:0;font-family:'Courier New',monospace;font-weight:bold;
  color:#4a3320;opacity:0;animation:zFly 2s ease-in-out infinite}
.loading-zzz span:nth-child(1){font-size:15px;animation-delay:0s}
.loading-zzz span:nth-child(2){font-size:21px;animation-delay:.55s}
.loading-zzz span:nth-child(3){font-size:28px;animation-delay:1.1s}
@keyframes zFly{0%{opacity:0;transform:translate(0,14px) rotate(-8deg)}20%{opacity:1}80%{opacity:.85}
  100%{opacity:0;transform:translate(30px,-70px) rotate(18deg)}}
.loading-text{font-family:'Courier New',monospace;font-size:15px;font-weight:bold;color:#4a3320;
  text-align:center;max-width:80vw;min-height:1.2em}
body.dark-mode .loading-zzz span,body.dark-mode .loading-text{color:#c9b48f}

/* Speed slider — same palette as the loading bar (.ptr tan track + #4a3320 border + #82a058 fill) */
#speed{-webkit-appearance:none;appearance:none;height:10px;box-sizing:border-box;border-radius:99px;
  background:#e7d4ac;border:2.5px solid #4a3320;outline:none}
/* Knob = a small sage circle with a dark-brown rim, centred on the 10px track:
   margin-top = (trackHeight − thumb)/2 = (10 − 16)/2 = −3px. */
/* Knob = the 48×48 Mona image, used as-is (square, uncropped). Sized 48px, pulled up so it straddles the track. */
#speed::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:48px;height:48px;border:0;
  cursor:pointer;margin-top:-19px;background:url('./mona_knob_48.png') center/48px 48px no-repeat}
#speed::-moz-range-track{height:10px;box-sizing:border-box;border-radius:99px;background:#e7d4ac;border:2.5px solid #4a3320}
#speed::-moz-range-thumb{width:48px;height:48px;border:0;border-radius:0;cursor:pointer;
  background:url('./mona_knob_48.png') center/48px 48px no-repeat}
#speedbox{padding-bottom:19px}   /* room for the oversized knob so it isn't clipped at the window edge */
/* ── UI gizmo panel: move/rotate handles for the selected complex, docked above the speed slider ── */
#gizmo-ui{position:fixed;left:16px;bottom:96px;z-index:26;display:none;width:154px;
  font-family:'Courier New',monospace;color:var(--ink);background:var(--paper);
  border:3px solid var(--brown);border-radius:16px;box-shadow:0 4px 0 var(--brown);
  padding:8px 10px;user-select:none;-webkit-user-select:none}
#gizmo-ui .giz-title{font-size:11px;font-weight:bold;color:var(--brown);margin-bottom:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gizmo-ui .giz-pads{display:flex;gap:8px}
#gizmo-ui .giz-pad{flex:1;height:54px;border:2.5px solid var(--brown);border-radius:12px;background:#e7d4ac;
  cursor:grab;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none}
#gizmo-ui .giz-pad.active{cursor:grabbing;background:var(--sage);color:var(--sageink)}
#gizmo-ui .giz-pad span{font-size:20px;line-height:1;pointer-events:none}
#gizmo-ui .giz-pad label{font-size:9px;font-weight:bold;pointer-events:none}
#gizmo-ui .giz-btns{display:flex;gap:5px;margin-top:7px}
#gizmo-ui .giz-btns button{flex:1;font-family:inherit;font-size:10px;font-weight:bold;color:var(--ink);
  background:var(--paper);border:2px solid var(--brown);border-radius:8px;padding:4px 2px;cursor:pointer}
#gizmo-ui .giz-btns button:active{background:var(--sage);color:var(--sageink)}
/* ── Bottom-right stack: hybridisation panel sits ABOVE the spawn element table ── */
#br-stack{position:absolute;right:14px;bottom:14px;z-index:25;display:flex;flex-direction:column;
  align-items:flex-end;gap:12px;pointer-events:none}
#br-stack>*{pointer-events:auto}
/* Panels — thick brown outline, big round corners, chunky drop shadow */
#econf,#eltable{font-family:'Courier New',monospace;background:var(--paper);color:var(--ink);
  border:3px solid var(--brown);border-radius:18px;box-shadow:0 5px 0 var(--brown);user-select:none}
#eltable{padding:10px 11px;width:274px;box-sizing:border-box}   /* fixed width so it doesn't resize when switching tabs */
#eltable .seg{display:flex;margin-bottom:9px;border:2.5px solid var(--brown);border-radius:99px;overflow:hidden}
#eltable .segbtn{flex:1;font-family:inherit;font-size:9.5px;font-weight:bold;color:var(--ink);background:var(--paper);border:none;border-right:2px solid var(--brown);padding:5px 2px;cursor:pointer;white-space:nowrap}
#eltable .segbtn:last-child{border-right:none}
#eltable .segbtn.on{background:var(--sage);color:var(--sageink)}
#eltable .segpane{font-size:12px;color:var(--brown);opacity:.7;padding:22px 8px;text-align:center}
#cof-formula svg{width:100%;height:100%;display:block}   /* the cofactor 2D formula fills its box - viewBox+preserveAspectRatio letterbox the drawing to fit */
#cof-formula img{max-width:100%;max-height:100%;object-fit:contain;display:block;margin:auto}
#eltable .elhdr{font-size:12px;font-weight:bold;color:var(--brown);letter-spacing:.5px;margin-bottom:8px;

#eltable .elclear:active{transform:translateY(1px);box-shadow:0 1px 0 var(--brown)}

/* Orbital chips (electron-config panel): electron boxes on the LEFT, then the orbital's REAL shape as the
   button icon (s = sphere, p = dumbbell, sp/sp²/sp³ + lone pair = hybrid lobe), then its identifier text. */
.orb-chip{font-family:inherit;color:var(--brown);background:transparent;border:2px solid transparent;
  border-radius:11px;padding:3px 10px 3px 5px;cursor:pointer;display:flex;flex-direction:row;
  align-items:center;gap:9px;line-height:1.15;text-align:left}
.orb-chip:hover{background:var(--paper2)}
.orb-chip.on{background:var(--sage);color:var(--sageink);border-color:var(--sage2)}
.orb-box{display:inline-flex;gap:5px;align-items:center;min-width:16px;justify-content:center}
.orb-shape{flex:0 0 auto;display:block}
.orb-cap{font-size:10px;font-weight:bold;opacity:.65}
.orb-name{font-size:15px;font-weight:bold}
/* Electron dot styled like the electric-blue glints on the 3-D orbital surfaces (bright core → blue glow) */
.orb-e{position:relative;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#f0f6ff 0%,#a9d0ff 30%,#4f8dff 72%,#2f6fe0 100%);
  box-shadow:0 0 4px 1px rgba(80,150,255,.9), inset 0 0 2px rgba(255,255,255,.6)}
/* An electron donated by the OTHER atom through a bond → the same glint, a shade darker */

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
'use strict';

const BOND_R    = 0.10;  // stick radius (Å) — thinner than the smallest ball
const GAP_FRAC  = 0.15;  // side-by-side gap as a fraction of mean model width
const FILL_SCALE = 0.72; // space-filling sphere size as a fraction of vdW radius (tightened so the surface ≈ the orbital cloud, not much bigger)

/* ── Standard CPK-ish colours (c), ball radii (r) + van der Waals radii (vr), Å.
      C dark grey, H light grey.  vr drives the space-filling surface mode.  ── */
/* n = nucleon count (mass number) → nucleus size; z = proton count; en = Pauling electronegativity (bond polarity). */
const ELEM = {
  H :{c:[0.88,0.88,0.88], r:0.23, vr:1.10, n:1,  z:1 , en:2.20},   C :{c:[0.42,0.42,0.42], r:0.32, vr:1.70, n:12, z:6 , en:2.55},
  N :{c:[0.19,0.31,0.97], r:0.31, vr:1.55, n:14, z:7 , en:3.04},   O :{c:[0.94,0.15,0.15], r:0.30, vr:1.52, n:16, z:8 , en:3.44},
  S :{c:[1.00,0.78,0.16], r:0.38, vr:1.80, n:32, z:16, en:2.58},   P :{c:[1.00,0.50,0.00], r:0.38, vr:1.80, n:31, z:15, en:2.19},
  MG:{c:[0.33,0.78,0.33], r:0.42, vr:1.73, n:24, z:12, en:1.31},   FE:{c:[0.88,0.40,0.20], r:0.42, vr:1.56, n:56, z:26, en:1.83},
  MN:{c:[0.61,0.48,0.78], r:0.42, vr:1.61, n:55, z:25, en:1.55},   CA:{c:[0.24,0.80,0.24], r:0.46, vr:1.97, n:40, z:20, en:1.00},
  ZN:{c:[0.49,0.51,0.69], r:0.40, vr:1.39, n:65, z:30, en:1.65},   CU:{c:[0.78,0.50,0.20], r:0.40, vr:1.40, n:64, z:29, en:1.90},
  CL:{c:[0.24,0.94,0.24], r:0.36, vr:1.75, n:35, z:17, en:3.16},   NA:{c:[0.67,0.36,0.95], r:0.46, vr:2.27, n:23, z:11, en:0.93},
  K :{c:[0.56,0.25,0.83], r:0.52, vr:2.75, n:39, z:19, en:0.82},   CO:{c:[0.94,0.56,0.63], r:0.42, vr:1.52, n:59, z:27, en:1.88},
  FB:{c:[0.55,0.55,0.55], r:0.32, vr:1.60, n:12, z:6 , en:2.50},
};
const info = code => ELEM[EL_LIST[code]] || ELEM.FB;
/* Full element names (shown big in the config panel; the symbol is no longer displayed there). */
const ELEM_NAME = {
  H:'Hydrogen', C:'Carbon', N:'Nitrogen', O:'Oxygen', S:'Sulfur', P:'Phosphorus',
  MG:'Magnesium', FE:'Iron', MN:'Manganese', CA:'Calcium', ZN:'Zinc', CU:'Copper',
  CL:'Chlorine', NA:'Sodium', K:'Potassium', CO:'Cobalt', FB:'Atom',
};
const elemName = code => ELEM_NAME[EL_LIST[code]] || EL_LIST[code] || 'Atom';
/* Finnish element names → the panel title reads "<name>atomi" (e.g. Hiili → "Hiiliatomi"). */
const ELEM_NAME_FI = {
  H:'Vety', C:'Hiili', N:'Typpi', O:'Happi', S:'Rikki', P:'Fosfori',
  MG:'Magnesium', FE:'Rauta', MN:'Mangaani', CA:'Kalsium', ZN:'Sinkki', CU:'Kupari',
  CL:'Kloori', NA:'Natrium', K:'Kalium', CO:'Koboltti',
};
const elemNameFi = code => { const n = ELEM_NAME_FI[EL_LIST[code]];
  if(!n) return 'Atomi';
  return n + (/a$/i.test(n) ? '-' : '') + 'atomi';   // "Rauta" → "Rauta-atomi" (a+a needs a hyphen), else just append
};

/* ── Element registry (symbol ↔ small integer code) ───────────────────── */
const EL_CODE = new Map(), EL_LIST = [];
function codeOf(sybyl){
  const dot = sybyl.indexOf('.');
  let sym = (dot === -1 ? sybyl : sybyl.slice(0, dot)).toUpperCase();
  if(!ELEM[sym]) sym = 'FB';
  let c = EL_CODE.get(sym);
  if(c === undefined){ c = EL_LIST.length; EL_CODE.set(sym, c); EL_LIST.push(sym); }
  return c;
}

/* Black-screen diagnostic. A throw during setup, a rejected promise, or a shader that fails to compile
   are all INVISIBLE when they happen — the canvas simply stays empty and the chrome still draws, which
   looks exactly like a black screen with nothing wrong. Put them on the page instead. */
(function(){
  const show = msg => { let b = document.getElementById('errbar');
    if(!b){ b = document.createElement('div'); b.id = 'errbar';
      b.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#7a1d1d;color:#fff;'
        + 'font:12px/1.45 ui-monospace,monospace;padding:8px 12px;white-space:pre-wrap;max-height:45vh;overflow:auto';
      (document.body || document.documentElement).appendChild(b); }
    if(b.textContent.length < 4000) b.textContent += (b.textContent ? String.fromCharCode(10) : '') + msg; };
  addEventListener('error', e => show('VIRHE: ' + e.message + '   (' + String(e.filename||'').split('/').pop() + ':' + e.lineno + ')'));
  addEventListener('unhandledrejection', e => show('VIRHE (promise): ' + ((e.reason && e.reason.message) || e.reason)));
  const ce = console.error;
  console.error = function(){ const t = Array.from(arguments).map(String).join(' ');
    if(/error|fail|compil|link|shader|WebGL/i.test(t)) show('KONSOLI: ' + t.slice(0, 600));
    return ce.apply(console, arguments); };
  window.__showErr = show;
})();

/* The first 5 seconds belong to Mona - the real build messages are held back until then and the one
   that was current when the hush lifts is what appears. */
let gLoadMsg = '', gLoadHush = true;
const paintLbl = () => { const e = document.getElementById('load-lbl'); if(e) e.textContent = gLoadHush ? 'Hys! Mona nukkuu.' : gLoadMsg; };
const setLbl = t => { gLoadMsg = t; paintLbl(); };
setTimeout(() => { gLoadHush = false; paintLbl(); }, 5000);
paintLbl();
/* The bar NEVER stalls. Each progress mark restarts a slow linear GLIDE from wherever the bar has got
   to, aimed most of the way to full but never at it — and because that glide is a CSS transition the
   compositor owns, it keeps moving even while a build step has the main thread locked solid, which no
   JS timer or rAF loop can do. Only the final mark actually fills it.
   (Call sites pass either a fraction or a percent — both are accepted.) */
let gBarMark = 0, gBarDone = false;
const barNow = e => { try { return new DOMMatrixReadOnly(getComputedStyle(e).transform).a; } catch(_){ return gBarMark; } };
const setBar = v => {
  const f = Math.max(0, Math.min(1, v > 1 ? v/100 : v));
  const e = document.getElementById('load-bar'); if(!e || gBarDone) return;
  if(f >= 1){ gBarDone = true; e.style.transition = 'transform .4s ease-out'; e.style.transform = 'scaleX(1)'; return; }
  gBarMark = Math.max(f, barNow(e));           // never step BACKWARD past where the glide already reached
  e.style.transition = 'none';                  // pin it there…
  e.style.transform = 'scaleX(' + gBarMark.toFixed(4) + ')';
  void e.offsetWidth;                           // …commit that before starting the next glide
  e.style.transition = 'transform 45s linear';
  e.style.transform = 'scaleX(' + (gBarMark + (0.96 - gBarMark)*0.7).toFixed(4) + ')';
};
setBar(0);   // start gliding the moment the page opens
const yield_ = () => new Promise(r => setTimeout(r, 0));

/* ── Goodsell-style muted palette, coloured by molecular component ─────── */
const CAT_COLORS = [
  [0.52,0.47,0.27],   // 0 protein     — muted olive/khaki
  [0.30,0.48,0.28],   // 1 chlorophyll — muted green
  [0.86,0.47,0.17],   // 2 carotenoid  — orange
  [0.60,0.22,0.18],   // 3 heme        — rust red
  [0.72,0.63,0.39],   // 4 lipid       — tan
  [0.52,0.55,0.62],   // 5 metal/ion   — slate
  [0.60,0.55,0.44],   // 6 other       — neutral tan
];
const RES_CAT = {};
'ALA ARG ASN ASP CYS GLN GLU GLY HIS ILE LEU LYS MET PHE PRO SER THR TRP TYR VAL HOH'.split(' ').forEach(r=>RES_CAT[r]=0);
'CHL CLA PHO BCL'.split(' ').forEach(r=>RES_CAT[r]=1);
'BCR LUT NEX XAT VIO ZEA ECH'.split(' ').forEach(r=>RES_CAT[r]=2);   // ECH = echinenone (b6f)
'HEM HEC'.split(' ').forEach(r=>RES_CAT[r]=3);
'DGD LMG LHG PL9 SQD LMT 6PL PGV LFA'.split(' ').forEach(r=>RES_CAT[r]=4);   // 6PL/PGV/LFA = b6f phospholipids + fatty acid
'CL FE2 FE MG MN CA NA K ZN OEX BCT CU CO'.split(' ').forEach(r=>RES_CAT[r]=5);
const catOf = res => RES_CAT[res] ?? 6;
// Electron-transport-chain cofactors → flagged so a button can render them on top of everything.
// The FULL light-harvesting + electron-transport set: every chlorophyll (antenna AND reaction-centre —
// P680/P700 can't be told apart from antenna Chl in this data), every carotenoid, the quinones, hemes,
// pheophytins, metal clusters, and Tyr Z (tagged geometrically in markTyrZ — it's a plain TYR residue,
// identified as the one hydrogen-bonded to the OEC).
// Each cofactor residue → a TYPE code (1-9) so the overlay can colour them by role, in vivid hues
// that stand out from the muted parent-model palette.
const ETC_RES = { OEX:1, MN:1, CA:1,   PHO:2,   PL9:3, PQN:3, PQ9:3, UQ:3,   HEM:4, HEC:4,
  SF4:5, FES:5, F3S:5, FE:5, FE2:5,   CU:6,
  CLA:7, CHL:7, BCL:7, CL0:7,                                   // chlorophylls (antenna + reaction centre)
  BCR:8, LUT:8, NEX:8, XAT:8, VIO:8, ZEA:8, LU2:8, A86:8, ECH:8,   // carotenoids (ECH = echinenone, b6f)
  NAP:10, NDP:10, NADP:10 };   // 10 = NADP+ / NADPH (FNR)
const ETC_TYRZ = 9;                                             // assigned geometrically, not by residue name
// The four real thylakoid membrane lipids, by their PDB residue names. MGDG and DGDG are the
// galactolipids (uncharged sugar heads) that dominate the bilayer, SQDG carries a sulfonate head
// and PG is the ONLY one with a phosphate head — so a realistic mix shows all four head groups.
const LIPID_RES = { LMG:1, DGD:2, SQD:3, LHG:4 };
// Every cofactor type is one of five bright hues: RED, GREEN, CORAL, BLUE, PINK.
const _RED=[1.00,0.16,0.16], _GRN=[0.16,0.90,0.36], _COR=[1.00,0.50,0.34], _BLU=[0.28,0.56,1.00], _PNK=[1.00,0.42,0.80];
/* One stable colour per MOLECULE (residue instance). Hashing the id spreads neighbouring residues to
   far-apart hues, so two chlorophylls sitting side by side never come out the same shade, while every
   atom of one molecule shares exactly one colour - which is what makes the grouping readable. */
function molCol(id){
  let h = (id ^ (id >>> 16)) >>> 0;
  h = (Math.imul(h, 2246822519) ^ (h >>> 13)) >>> 0;
  h = (Math.imul(h, 3266489917) ^ (h >>> 16)) >>> 0;
  const hue = (h >>> 8) / 16777216, sat = 0.55, lig = 0.62;
  const c = (1 - Math.abs(2*lig - 1)) * sat, x = c * (1 - Math.abs(((hue*6) % 2) - 1)), m = lig - c/2;
  const seg = Math.floor(hue*6) % 6;
  const rgb = [[c,x,0],[x,c,0],[0,c,x],[0,x,c],[x,0,c],[c,0,x]][seg];
  return [rgb[0]+m, rgb[1]+m, rgb[2]+m];
}
const ETC_COL = [ [0,0,0],   // 0 unused
  _COR,   // 1 OEC (Mn₄CaO₅)        — coral
  _PNK,   // 2 pheophytin           — pink
  _BLU,   // 3 plasto/phyllo-quinone — blue
  _RED,   // 4 heme                  — red
  _GRN,   // 5 Fe-S cluster          — green
  _BLU,   // 6 Cu (plastocyanin)     — blue
  _GRN,   // 7 chlorophyll           — green
  _COR,   // 8 carotenoid            — coral
  _PNK,   // 9 Tyr Z (D1-Tyr161)     — pink
  _PNK ]; // 10 NADPH (FNR)          — pink

/* ── Parse a multi-molecule mol2 into typed-array records ──────────────── */
function parseMol2(text){
  const lines = text.split('\n');
  const mols = [];
  let cur = null, section = '';
  for(let i = 0; i < lines.length; i++){
    const ln = lines[i];
    if(ln.charCodeAt(0) === 64){                 // '@' → section marker
      const t = ln.trim();
      if(t === '@<TRIPOS>MOLECULE'){ cur = {name:null}; mols.push(cur); section = 'HDR'; }
      else if(t === '@<TRIPOS>ATOM')  section = 'ATOM';
      else if(t === '@<TRIPOS>BOND')  section = 'BOND';
      else section = 'OTHER';
      continue;
    }
    if(section === 'HDR'){
      if(cur.name === null){ cur.name = ln.trim(); }
      else if(cur.na === undefined){
        const p = ln.trim().split(/\s+/);
        cur.na = +p[0]; cur.nb = +p[1] || 0;
        cur.x  = new Float32Array(cur.na); cur.y = new Float32Array(cur.na);
        cur.z  = new Float32Array(cur.na); cur.el = new Uint16Array(cur.na); cur.ai = 0;
        cur.cat = new Uint8Array(cur.na);
        cur.cof = new Uint8Array(cur.na);  // 1 = electron-transport-chain cofactor (for the render-on-top overlay)
        cur.sid = new Int32Array(cur.na);  // subst_id (residue instance) → to extract one chlorophyll
        cur.tyr = new Uint8Array(cur.na);  // 1 = atom of a TYR residue → markTyrZ picks the one beside the OEC
        cur.lip = new Uint8Array(cur.na);  // LIPID_RES code → lets the bilayer tile a real MGDG/DGDG/SQDG/PG mixture
        cur.b1 = new Int32Array(cur.nb);   cur.b2 = new Int32Array(cur.nb);  cur.bi = 0;
        cur.bo = new Uint8Array(cur.nb);   // bond order (1 single, 2 double, 3 triple)
      }
      continue;
    }
    if(section === 'ATOM'){
      const p = ln.trim().split(/\s+/);
      if(p.length < 6 || cur.ai >= cur.na) continue;
      const k = cur.ai++;
      cur.x[k] = +p[2]; cur.y[k] = +p[3]; cur.z[k] = +p[4]; cur.el[k] = codeOf(p[5]);
      cur.cat[k] = catOf(p[7] || ''); cur.sid[k] = +p[6] || 0; cur.cof[k] = ETC_RES[p[7]] || 0;   // 0 = not a cofactor, else type code 1-9
      if(p[7] === 'TYR') cur.tyr[k] = 1;
      cur.lip[k] = LIPID_RES[p[7]] || 0;
    } else if(section === 'BOND'){
      const p = ln.trim().split(/\s+/);
      if(p.length < 4 || cur.bi >= cur.nb) continue;
      const k = cur.bi++;
      cur.b1[k] = (+p[1]) - 1; cur.b2[k] = (+p[2]) - 1;
      cur.bo[k] = p[3]==='2' ? 2 : p[3]==='3' ? 3 : 1;   // double / triple / (single, aromatic, amide → 1)
    }
  }
  return mols.filter(m => m.na > 0);
}

/* Tyr Z (D1-Tyr161) — the redox-active tyrosine that ferries electrons from the OEC to P680⁺.
   The mol2 carries no chain id or PDB numbering, so name-matching can't find it; instead we use the
   geometry that DEFINES it: it is the one tyrosine hydrogen-bonded to the Mn₄CaO₅ cluster (~5 Å).
   Tyr D, its pseudo-symmetric twin on D2, sits ~30 Å from any Mn and is correctly left unmarked.
   A dimer simply yields one Tyr Z per monomer. Marks every atom of each matching TYR residue. */
function markTyrZ(m){
  if(!m.tyr || !m.cof) return;
  const oi=[];                                                 // OEC atom indices (Mn/Ca/O of the cluster)
  for(let k=0;k<m.na;k++) if(m.cof[k]===1) oi.push(k);
  if(!oi.length) return;                                       // no OEC in this model → no Tyr Z
  // Split the OEC atoms into clusters (one per PSII monomer) by single-linkage within 6 Å.
  const cid = new Array(oi.length).fill(-1); let nc = 0;
  for(let a=0;a<oi.length;a++){
    if(cid[a] >= 0) continue;
    cid[a] = nc; const stack=[a];
    while(stack.length){ const p=stack.pop(), pk=oi[p];
      for(let b=0;b<oi.length;b++){ if(cid[b]>=0) continue; const bk=oi[b];
        const dx=m.x[pk]-m.x[bk], dy=m.y[pk]-m.y[bk], dz=m.z[pk]-m.z[bk];
        if(dx*dx+dy*dy+dz*dz < 36){ cid[b]=nc; stack.push(b); } } }
    nc++;
  }
  // Per cluster, the SINGLE closest tyrosine is Tyr Z (its OH hydrogen-bonds the cluster, ~5 Å).
  // Tyr D, the pseudo-symmetric twin on D2, is ~30 Å away and never wins.
  const best = new Array(nc).fill(-1), bestD = new Array(nc).fill(Infinity);
  const resMin = new Map();                                    // residue id → [minDist², cluster]
  for(let k=0;k<m.na;k++){
    if(!m.tyr[k]) continue;
    for(let a=0;a<oi.length;a++){ const ok=oi[a];
      const dx=m.x[k]-m.x[ok], dy=m.y[k]-m.y[ok], dz=m.z[k]-m.z[ok], d2=dx*dx+dy*dy+dz*dz;
      const cur = resMin.get(m.sid[k]);
      if(!cur || d2 < cur[0]) resMin.set(m.sid[k], [d2, cid[a]]);
    }
  }
  // Only a REAL Mn₄CaO₅ cluster counts — lone Mn/Ca ions elsewhere in the structure form their own
  // 1-2 atom "clusters" and would each drag in a spurious nearby tyrosine.
  const csize = new Array(nc).fill(0); for(const c of cid) csize[c]++;
  for(const [sid, v] of resMin){ const [d2, c] = v;
    if(csize[c] >= 4 && d2 < 100 && d2 < bestD[c]){ bestD[c] = d2; best[c] = sid; } }   // within 10 Å, nearest wins
  const hit = new Set(best.filter(s => s >= 0));
  if(!hit.size) return;
  for(let k=0;k<m.na;k++) if(m.tyr[k] && hit.has(m.sid[k])) m.cof[k] = ETC_TYRZ;
}

/* Pull one complete chlorophyll (CLA/CHL/PHO residue) out of the model as its own molecule. */
function extractChlorophyll(m){
  if(!m.sid) return null;
  const groups = new Map();                      // group chlorophyll atoms by residue id
  for(let k=0;k<m.na;k++) if(m.cat[k]===1){
    const g = groups.get(m.sid[k]); if(g) g.push(k); else groups.set(m.sid[k], [k]);
  }
  let best = null;
  for(const g of groups.values()) if(!best || g.length > best.length) best = g;   // the largest = a full chlorophyll
  if(!best || best.length < 20) return null;
  const na = best.length, map = new Map();
  best.forEach((gi,li) => map.set(gi, li));
  const nm = { name:'Chlorophyll', na, ai:na, nb:0,
    x:new Float32Array(na), y:new Float32Array(na), z:new Float32Array(na),
    el:new Uint16Array(na), cat:new Uint8Array(na), sid:new Int32Array(na) };
  for(let li=0;li<na;li++){ const gi=best[li];
    nm.x[li]=m.x[gi]; nm.y[li]=m.y[gi]; nm.z[li]=m.z[gi]; nm.el[li]=m.el[gi]; nm.cat[li]=m.cat[gi]; }
  const b1=[], b2=[], bo=[];                      // keep only bonds internal to this residue (remapped)
  for(let k=0;k<m.nb;k++){ const a=m.b1[k], b=m.b2[k];
    if(map.has(a) && map.has(b)){ b1.push(map.get(a)); b2.push(map.get(b)); bo.push(m.bo[k]); } }
  nm.nb=b1.length; nm.b1=Int32Array.from(b1); nm.b2=Int32Array.from(b2); nm.bo=Uint8Array.from(bo);
  return nm;
}

/* Pull one lipid molecule (category 4) out of the model → atoms AND its internal bonds
   (the bonds are needed to build the same hybridised σ/π/lone-pair lobes as the protein). */
function extractLipid(m, code){
  if(!m.sid) return null;
  const groups = new Map();
  // `code` (a LIPID_RES value) picks ONE named lipid species. Without it, the largest lipid of any
  // kind is taken — kept as the fallback for models whose lipids carry names we do not recognise.
  for(let k=0;k<m.na;k++){ const want = code ? (m.lip && m.lip[k]===code) : (m.cat[k]===4);
    if(want){ const g=groups.get(m.sid[k]); if(g) g.push(k); else groups.set(m.sid[k],[k]); } }
  let best=null;
  for(const g of groups.values()) if(!best || g.length>best.length) best=g;   // largest = a complete lipid
  if(!best || best.length < 30) return null;
  const na=best.length, map=new Map();
  best.forEach((gi,li) => map.set(gi, li));
  const out={ na, nb:0, x:new Float32Array(na), y:new Float32Array(na), z:new Float32Array(na), el:new Uint16Array(na) };
  for(let li=0;li<na;li++){ const gi=best[li]; out.x[li]=m.x[gi]; out.y[li]=m.y[gi]; out.z[li]=m.z[gi]; out.el[li]=m.el[gi]; }
  const b1=[], b2=[], bo=[];                      // keep only bonds internal to this residue (remapped)
  for(let k=0;k<m.nb;k++){ const a=m.b1[k], b=m.b2[k];
    if(map.has(a) && map.has(b)){ b1.push(map.get(a)); b2.push(map.get(b)); bo.push(m.bo[k]); } }
  out.nb=b1.length; out.b1=Int32Array.from(b1); out.b2=Int32Array.from(b2); out.bo=Uint8Array.from(bo);
  return out;
}

attribute float molId;

uniform float molTexDim;

#else

#endif

  float inCone = (coneCos < -0.5) ? 1.0 : 1.0 - smoothstep(coneCos*0.86, coneCos, perp);   // soft-edged cone rim
  float reveal = (1.0 - edge) * inCone;                       // 1 = orbitals/nuclei show here, 0 = vdW shell
  float rimGlass = mix(shellMin, 0.72, smoothstep(0.34, 1.0, r2));   // revealed shell = a glass bubble, near-clear centre and a visible rim, so the orbitals inside stand out
  // Distance gradient - a revealed shell is full glass right up close and fades to (revealFade) opaque at the reveal
  // edge, so distant atoms stay mostly solid while only the ones you are on top of go clear.
  float grad = smoothstep(0.0, bubbleR, dist);               // 0 close → 1 at the reveal edge
  float glassA = mix(rimGlass, max(rimGlass, revealFade), grad);
  alpha *= (isShell < 0.5) ? reveal : mix(1.0, glassA, reveal);   // core fades IN where revealed, shell becomes the distance-graded glass bubble
  alpha *= 1.0 - smoothstep(1.0 - aa, 1.0 + aa, r2);          // anti-aliased silhouette (soft coverage at the disc edge)
#ifdef COFHIDE
  // Line of sight to the ETC cofactors: an atom IN FRONT of a cofactor goes see-through so the cofactor
  // behind shows through. cofClear flags it here - the fill/outline opacity + outline colour apply below.
  float cofClear = 0.0;
  if(cofHideOn > 0.5){
    vec4 cClip = projection * vec4(vCenterV, 1.0);
    vec2 cUV = (cClip.xy / cClip.w) * 0.5 + 0.5;
    float rd = texture2D(cofDepth, cUV).r;                          // deepest per-atom CONE reveal-depth at this pixel (0 = no cofactor cone here)
    if(rd > 0.5 && vCenterV.z < rd - 0.6) cofClear = 1.0;           // atom is in front of the cone → mark it see-through (fill/outline opacity + colour applied at output)
  }
#endif
  if(alpha < 0.004) discard;                                  // fully transparent → skip (also keeps depth clean)
  if(depthBias > 0.0 && distance(vWCen, selCenter) < 0.35) discard;   // selected atom → its spinning highlight nucleus draws instead
  // Bias the nucleus toward the camera so it beats its OWN orbitals (but not atoms clearly in front).
  // CLAMPED to half the remaining view depth - a flat 2-unit shove would push an atom you are zoomed
  // right up against straight through the near plane, and its nucleus would vanish until you backed off.
  posV.z -= min(depthBias, posV.z * 0.5);
  vec4 clip = projection * vec4(posV, 1.0);
  gl_FragDepthEXT = clip.z / clip.w * 0.5 + 0.5;
  vec3 col = vColor;   // flat - no light direction, so an atom is its own colour wherever it faces
  col *= 1.0 - 0.14 * smoothstep(0.55, 1.0, r2);              // subtle self-shade
  if(focusAmt > 0.001){   // O: grayscale this fragment unless it is part of the selection → the coloured region is the EXACT silhouette
    bool fsel;
    if(focusMode > 2.5){   // mode 3 = a cofactor GROUP: only the overlay atoms tagged with that group keep colour
#ifdef ETCHL
      fsel = abs(vGid - focusGroup) < 0.5;
#else
      fsel = false;        // the protein underneath greys out
#endif
    } else if(focusMode > 1.5){ fsel = (vMid >= 0.0 && focusSet[int(vMid + 0.5)] > 0.5); }   // mode 2 = model set
    else if(focusMode > 0.5){ fsel = distance(vCenterV, focusCenterV) < focusR; }             // mode 1 = point
    else fsel = false;                                                                        // mode 0 = grey all
    if(!fsel){ float fg = dot(col, vec3(0.299, 0.587, 0.114)); col = mix(col, vec3(fg) * (1.0 - focusDark), focusAmt); } }
#ifdef ETCHL
  bool hl = abs(vGid - hlGroup) < 0.5;                        // hovered / flashing cofactor group
  if(hl) col *= hlBright;                                     // → brighter FILL (the dark outline is applied AFTER, so it stays dark)
#endif
  // Ink outline band. Normally starts at 0.86 (width 0.14). For atoms REVEALING orbitals (glass shells)
  // start it at 0.965 (width 0.035 ≈ 4× thinner) so the thin rim doesn't obscure the orbitals inside.
  float rimStart = mix(0.86, 0.965, (isShell > 0.5) ? reveal : 0.0);
#ifdef ETCHL
  if(hl) rimStart -= (hlBright - 1.0) * 0.5;                  // → thicker vdW outline, scaled by the highlight brightness → steady on hover, PULSES with the select flash
#endif
#ifdef ETCTHIN
  rimStart = max(rimStart, 0.94);                            // cofactor overlay - a thin outline that matches the protein silhouette (not the fat 0.14 per-atom rim)
#endif
  float rim = smoothstep(rimStart - min(aa, 0.008), 1.0, r2);   // thin ink band like the orbital lobes, tiny aa only so revealed shells do not get a fat outline
  // Subtle electric-blue shimmer: a faint cool sheen that rides the sphere's grazing edge and drifts in time.
  if(protonOutline < 0.5){
    float fres = pow(1.0 - zc, 2.3);
    float shim = 0.5 + 0.5*sin(uT*2.3 + vWCen.x*0.14 + vWCen.y*0.10 + vWCen.z*0.12);
    col += vec3(0.10, 0.24, 0.55) * fres * (0.34 + 0.5*shim);
  }
  if(protonOutline > 0.5 && vFlag > 0.5){
    float pf = pow(1.0 - zc, 1.6);                           // broad, soft Fresnel (zc = sqrt(1-r2)) → hazy edge
    col = mix(col, vec3(1.0, 0.18, 0.18), pf) + vec3(0.40, 0.0, 0.0) * pf;   // hazy red glow on protons
  } else {
#ifdef ETCDARK
    col = mix(col, vec3(0.03), rim);                       // cofactors → a BLACK outline that traces the molecule shape (each atom outlined, interior rims occluded by the atoms in front → the eye reads the outer contour)
#else
 #ifdef COFHIDE
    col = mix(col, (cofClear > 0.5) ? vec3(cofOutCol) : vColor * 0.40, rim);   // a see-through atom's outline uses the dev colour, otherwise the atom's own 40% shade
 #else
    col = mix(col, vColor * 0.40, rim);                    // rim → a FIXED 40% shade of the atom's own UNLIT colour → same darkness whichever way the sphere faces the light (was col *= mix(1.0,0.40,rim), whose 40%-of-LIT-colour went near-black on shadowed edges → the inconsistent thick-black outlines)
 #endif
#endif
  }
  // Selected complex → repaint each of its atoms' rims sage. Every atom is outlined, so the shape
  // the eye picks up is the OUTER contour of the whole protein (interior rims are hidden behind the
  // atoms in front of them) — an outline, not the filled silhouette a highlight layer would give.
  if(selModel >= 0.0 && abs(vMid - selModel) < 0.5)
    col = mix(col, selCol, smoothstep(0.55, 1.0, r2) * 0.95);

  gl_FragColor = vec4(vec3(0.06), rim);   // BLACK ink ring (like every other atom's outline), on top of everything

#endif
#ifdef COFHIDE
  if(cofClear > 0.5) alpha *= mix(cofAlpha, cofOutAlpha, rim);   // see-through atom: fill opacity in the body, outline opacity on the rim
#endif
#ifdef DEPTHSHADE
  // Front-to-back darkening, applied to the FINAL colour (after the outline) so the outline darkens WITH
  // the fill and stays visible. dt ramps 0 at the start point to 1 across the spread, farther = darker.
  float dt = clamp((vWCen.z - focalD - startOff) / max(spread, 1.0), 0.0, 1.0);   // distance from the FIXED shading plane (focalD, world Z), not the camera
  col *= mix(1.0, depthLo, dt * depthK);
#endif
  float fog = clamp((fogEnd - posV.z) / (fogEnd - fogStart), 0.0, 1.0);
#ifdef PLIGHT
  col += protonLight(vWCen);
#endif
  gl_FragColor = vec4(mix(fogColor, col, fog), alpha);
}`;

/* Cofactor line-of-sight depth pass — EVERY cofactor atom as a camera-facing disc. Each atom defines
   its OWN cone (a frustum): radius tipRatio of the disc AT the atom, radius baseRatio toward the camera.
   Per pixel we keep the DEEPEST "reveal depth" over all atoms' cones (via gl_FragDepthEXT), so the union
   of cones reflects the whole cofactor's SHAPE. The protein shader clears an atom in front of that depth.
   revealDepth(du) = baseRatio*vz / (du + baseRatio - tipRatio):  = vz at a cone's axis (clears to the atom),
   shrinks toward the disc edge → a cone tapering to each atom. */
BABYLON.Effect.ShadersStore['cofdVertexShader'] = `
precision highp float;
attribute vec3 position;                       // ±1 quad corner
attribute vec4 world0; attribute vec4 world1; attribute vec4 world2; attribute vec4 world3;
attribute float dr;                            // this atom's tube radius in WORLD units, Ångström (0 = its type is toggled off)
attribute float modelId;                       // which loaded model this cofactor atom belongs to
uniform mat4 view; uniform mat4 projection;
uniform mat4 modelXform[24];                   // per-model transform so the cone follows a moved molecule
varying vec2 vq; varying float vz;
void main(void){
  vec3 center = vec3(world3.x, world3.y, world3.z);   // instance translation = atom centre
  center = (modelXform[int(modelId + 0.5)] * vec4(center, 1.0)).xyz;   // follow the model drag/rotate
  vec4 cv = view * vec4(center, 1.0);
  vz = cv.z;                                          // view-space depth (larger = farther)
  vq = position.xy;
  cv.xy += vq * dr;                                   // camera-facing disc of a FIXED WORLD radius (constant tube diameter in Ångström)
  gl_Position = projection * cv;
}`;
BABYLON.Effect.ShadersStore['cofdFragmentShader'] = `
precision highp float;
uniform float tipRatio;   // cone width AT the atom (0 = point tip)
uniform float baseRatio;  // cone width toward the CAMERA
uniform float coneReach;  // extra depth BEHIND the atom the cone still clears (Å)
varying vec2 vq; varying float vz;
void main(void){
  if(dot(vq, vq) > 1.0) discard;                // circular tunnel cross-section
  float du = length(vq);                        // 0 at this atom's axis → 1 at its disc edge
  float denom = du + baseRatio - tipRatio;
  float rd = (denom > 0.001) ? (baseRatio * vz / denom) : 1.0e8;   // this atom's cone reveal-depth at this pixel
  rd = min(rd + coneReach, 1.0e8);              // push the reveal a bit deeper (behind the atom)
  gl_FragColor = vec4(rd, 0.0, 0.0, 1.0);       // R = reveal depth (protein in front of it clears here)
  gl_FragDepthEXT = 1.0 - clamp(rd, 0.0, 6000.0) / 6001.0;   // DEEPEST reveal wins → union of every atom's cone
}`;

// Electron glow: a small breathing point of light that slowly orbits its camera-facing spot,
// with flickering electric filaments crackling around it. nElec = 1 or 2.
float elecBolt(vec3 N, vec3 e, vec3 uref){
  float fr = (vOid >= 2000.0) ? 1.9 : (vOid >= 900.0) ? 1.2 : (0.6*max(0.0, floor(vOid/100.0) - 1.0));   // energy ladder: core shells (rise with n) < bonding σ/π (900–1999, stabilised) < lone pairs (≥2000, non-bonding, often the HOMO)
  float d = clamp(dot(N, e), -1.0, 1.0);
  vec3 tp = N - d*e;
  vec3 u = normalize(uref - dot(uref, e)*e), w = cross(e, u);
  float ang = atan(dot(tp, w), dot(tp, u));
  float rad = acos(clamp(d, 0.0, 1.0));               // angular distance from the electron point
  // A wave that TRAVELS around the ring: bright crests march around the circle over time via the
  // azimuthal phase (m·ang − ω·t + spiral) while the concentric rings breathe outward. m (crests
  // around the ring) rises with orbital energy — the moving, phase-shifting ripple, not a static bloom.
  float m = 3.0 + fr * 9.0;
  float rings  = 0.5 + 0.5*sin(rad*20.0 - uT*2.5);          // concentric rings, slow outward breath
  float travel = 0.6 + 0.4*sin(ang*m - uT*4.0 + rad*6.0);   // bright crests march AROUND the circle
  return rings * travel * exp(-rad*3.4);
}
// A quasi-random wandering direction (incommensurate sines → never repeats), per-lobe phase s.
vec3 wanderDir(float s){
  return normalize(vec3(
    sin(uT*0.73 + s) + 0.7*sin(uT*1.61 + s*2.3),
    sin(uT*0.91 + s*1.7) + 0.7*sin(uT*1.29 + s*0.6),
    sin(uT*1.13 + s*0.4) + 0.7*sin(uT*0.53 + s*3.1)));
}
// Fold a full-sphere direction onto the camera-facing hemisphere so the electron is ALWAYS visible
// (never slips behind the lobe), while still roaming the whole visible surface.
vec3 toFront(vec3 w, vec3 V, vec3 fb){
  float d = clamp(dot(w, V), -1.0, 1.0);
  vec3 tang = w - d*V; float tl = length(tang);
  tang = tl > 1e-4 ? tang/tl : fb;

void electrons(inout vec3 c, float ne, float bri){
  vec3 N = normalize(vNrmV);
  vec3 V = normalize(-vViewPos);                 // toward the camera
  float ph = vSeed * 6.2831;
  vec3 axA = vec3(cos(ph), sin(ph), 0.0);
  vec3 axB = vec3(-sin(ph), cos(ph), 0.0);
  vec3 e1 = toFront(wanderDir(ph), V, axA);         // wandering electron, always on the camera-facing side
  float d1 = max(dot(N, e1), 0.0);

  if(ne > 1.5){

    float d2 = max(dot(N, e2), 0.0);
    glow += pow(d2, 44.0); core += pow(d2, 220.0); bolt += elecBolt(N, e2, axB);

uniform mat4 projection;
uniform float bubbleR;
uniform float uT;
uniform float nElec;
uniform float focusId;
uniform float coneCos;
uniform float depthBias;
varying vec3 vViewPos;
varying vec3 vNrmV;
varying vec3 vCol;
varying vec3 vLocalDir;
varying float vSeed;
varying float vSel;
varying float vOid;
varying float vCang;
#ifdef MEMFADE
varying vec3 vMemW; uniform vec3 memCut;
#endif
float elecBolt(vec3 N, vec3 e, vec3 uref){
  float fr = (vOid >= 2000.0) ? 1.9 : (vOid >= 900.0) ? 1.2 : (0.6*max(0.0, floor(vOid/100.0) - 1.0));   // energy ladder: core shells (rise with n) < bonding σ/π (900–1999, stabilised) < lone pairs (≥2000, non-bonding, often the HOMO)
  float d = clamp(dot(N, e), -1.0, 1.0);
  vec3 tp = N - d*e;
  vec3 u = normalize(uref - dot(uref, e)*e), w = cross(e, u);
  float ang = atan(dot(tp, w), dot(tp, u));
  float rad = acos(clamp(d, 0.0, 1.0));               // angular distance from the electron point
  // A wave that TRAVELS around the ring: bright crests march around the circle over time via the
  // azimuthal phase (m·ang − ω·t + spiral) while the concentric rings breathe outward. m (crests
  // around the ring) rises with orbital energy — the moving, phase-shifting ripple, not a static bloom.
  float m = 3.0 + fr * 9.0;
  float rings  = 0.5 + 0.5*sin(rad*20.0 - uT*2.5);          // concentric rings, slow outward breath
  float travel = 0.6 + 0.4*sin(ang*m - uT*4.0 + rad*6.0);   // bright crests march AROUND the circle

}
vec3 wanderDir(float s){
  return normalize(vec3(
    sin(uT*0.73 + s) + 0.7*sin(uT*1.61 + s*2.3),
    sin(uT*0.91 + s*1.7) + 0.7*sin(uT*1.29 + s*0.6),
    sin(uT*1.13 + s*0.4) + 0.7*sin(uT*0.53 + s*3.1)));

vec3 toFront(vec3 w, vec3 V, vec3 fb){
  float d = clamp(dot(w, V), -1.0, 1.0);

  float ph = vSeed * 6.2831;
  vec3 axA = vec3(cos(ph), sin(ph), 0.0);
  vec3 axB = vec3(-sin(ph), cos(ph), 0.0);

  vec3 e1 = toFront(wanderDir(ph), V, axA);

  float alpha = 1.0;

#endif

  vec4 clip = projection * vec4(pv, 1.0);

  gl_FragColor = vec4(g, 1.0);
}`;

float luma(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }
void main(void){
  vec3 c = texture2D(textureSampler, vUV).rgb;

  // Watercolour soft fill: weighted cross blur → colour bleeds a little.
  vec3 blur = c * 2.0;
  blur += texture2D(textureSampler, vUV + texel*vec2( 1.4, 0.0)).rgb;
  blur += texture2D(textureSampler, vUV + texel*vec2(-1.4, 0.0)).rgb;
  blur += texture2D(textureSampler, vUV + texel*vec2( 0.0, 1.4)).rgb;
  blur += texture2D(textureSampler, vUV + texel*vec2( 0.0,-1.4)).rgb;
  blur /= 6.0;

  // Brighten before banding (gamma lift) so more of the tonal range is painted.
  vec3 lit = pow(clamp(blur * bright, 0.0, 1.0), vec3(0.8));

  // Posterise into flat painted bands.
  vec3 p = floor(lit * bands + 0.5) / bands;

  // Painted grade: ease saturation down, warm the whites, very gentle S-contrast.
  float lum = luma(p);
  p = mix(vec3(lum), p, 0.9);
  p *= vec3(1.03, 1.0, 0.96);
  p = clamp((p - 0.5) * 1.03 + 0.5, 0.0, 1.0);

  // Ink outline: Sobel on luminance of the sharp (un-blurred) image.
  float tl=luma(texture2D(textureSampler,vUV+texel*vec2(-1.,-1.)).rgb);
  float tc=luma(texture2D(textureSampler,vUV+texel*vec2( 0.,-1.)).rgb);
  float tr=luma(texture2D(textureSampler,vUV+texel*vec2( 1.,-1.)).rgb);
  float ml=luma(texture2D(textureSampler,vUV+texel*vec2(-1., 0.)).rgb);
  float mr=luma(texture2D(textureSampler,vUV+texel*vec2( 1., 0.)).rgb);
  float bl=luma(texture2D(textureSampler,vUV+texel*vec2(-1., 1.)).rgb);
  float bc=luma(texture2D(textureSampler,vUV+texel*vec2( 0., 1.)).rgb);
  float br=luma(texture2D(textureSampler,vUV+texel*vec2( 1., 1.)).rgb);
  float gx = -tl - 2.0*ml - bl + tr + 2.0*mr + br;
  float gy = -tl - 2.0*tc - tr + bl + 2.0*bc + br;
  float g  = sqrt(gx*gx + gy*gy) * edgeAmt;
  float ink = smoothstep(0.55, 0.82, g);   // higher, narrower band → thinner ink lines
  vec3 col = mix(p, vec3(0.12), ink);   // outline = a FIXED dark ink → uniform darkness whatever the local brightness (was p*0.26, which inked dark/shadowed regions near-black but light regions pale → light-direction-dependent outlines)

  // Static paper grain (per-2px, no time → no shimmer).
  float n = fract(sin(dot(floor(vUV/texel*0.5), vec2(12.9898, 78.233))) * 43758.5453);
  col += (n - 0.5) * paperAmt;

  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

/* Cofactor silhouette — inks a single black outline around each cofactor MOLECULE, on top of the
   finished frame. cofMask is the cofactors' solid coverage (1 = cofactor, drawn ignoring the protein
   so buried cofactors still outline). The EDGE of that filled coverage is the molecule's outer contour
   — interior atoms are all 1, so they produce no line — which is why this traces the whole molecule,
   not every atom. */
BABYLON.Effect.ShadersStore['cofsilPixelShader'] = `
precision highp float;
varying vec2 vUV;
uniform sampler2D textureSampler;
uniform sampler2D cofMask;
uniform vec2 texel;
uniform float cofW;
void main(void){
  vec3 scene = texture2D(textureSampler, vUV).rgb;
  float c = texture2D(cofMask, vUV).r, mn = c, mx = c;   // cofactor coverage (crisp mask)
  for(int i=0;i<8;i++){
    float a = float(i) * 0.7853982;
    vec2 dir = vec2(cos(a), sin(a)) * texel;
    float s = texture2D(cofMask, vUV + dir*cofW).r;
    mn = min(mn, s); mx = max(mx, s);
  }
  float cofLine = smoothstep(0.2, 0.7, mx - mn);   // cofactor molecule silhouette only. The whole-protein outline is left to the atoms own hugging rims, so there is no detached second edge floating off the molecule.
  gl_FragColor = vec4(mix(scene, vec3(0.03), cofLine), 1.0);   // silhouette = black
}`;
/* RTS selection mask: each selected atom rendered as a SOLID white disc (paired with the imp vertex, so it
   sits exactly on the atoms). The union is the selected complexes' filled coverage → the seloutline pass
   inks a thick green ring around its OUTER edge = one bold outline tracing the shape. */
BABYLON.Effect.ShadersStore['selmaskFragmentShader'] = `
precision highp float;
varying vec2 vUV;
void main(void){ if(dot(vUV, vUV) > 1.0) discard; gl_FragColor = vec4(1.0); }`;
BABYLON.Effect.ShadersStore['seloutlinePixelShader'] = `
precision highp float;
varying vec2 vUV;
uniform sampler2D textureSampler;
uniform sampler2D selMask;
uniform vec2 texel;
uniform float owidth;
uniform float selOn;
uniform float glowT;   // seconds, for the slow breathing pulse of the glow
void main(void){
  vec3 scene = texture2D(textureSampler, vUV).rgb;
  if(selOn < 0.5){ gl_FragColor = vec4(scene, 1.0); return; }
  float c = texture2D(selMask, vUV).r, gmn=c, gmx=c, bA=0.0, bB=0.0;
  for(int i=0;i<16;i++){ float a = float(i) * 0.3926991; vec2 u = vec2(cos(a), sin(a)) * texel;
    float sg = texture2D(selMask, vUV + u*owidth).r; gmn=min(gmn,sg); gmx=max(gmx,sg);   // THICK band -> the ring
  }
  // The two blurred copies that make the glow need far fewer directions than the ring does - 8 apiece
  // is indistinguishable and keeps this pass at the 32 taps it cost before the glow existed.
  for(int i=0;i<8;i++){ float a = float(i) * 0.7853982; vec2 u = vec2(cos(a), sin(a)) * texel;
    bA += texture2D(selMask, vUV + u*(owidth*2.0)).r;
    bB += texture2D(selMask, vUV + u*(owidth*4.5)).r;
  }
  float ring = smoothstep(0.15, 0.6, gmx - gmn);   // thick green ring straddling the coverage edge
  // Outward glow - the blurred coverage, kept OUTSIDE the shape so it reads as light spilling off the
  // ring instead of a wash over the protein. The narrow black band that used to sit on top is gone,
  // so green is now the only selection colour.
  float halo = max(bA*0.125*0.90, bB*0.125*0.55) * (1.0 - c);
  float pulse = 0.72 + 0.28*sin(glowT*2.1);
  vec3 GC = vec3(0.16, 1.0, 0.34);
  vec3 col = scene + GC * halo * halo * 1.25 * pulse;
  col = mix(col, GC, ring);
  gl_FragColor = vec4(min(col, vec3(1.0)), 1.0);
}`;

/* ── Static dark-green background ──────────────────────────────────────────
   A full-screen quad drawn at the far plane (z ≈ 1, LESS depth test) so every
   atom draws over it regardless of order. Flat dark green — no gradient/wobble. */
BABYLON.Effect.ShadersStore['bgVertexShader'] = `
precision highp float;
attribute vec3 position;
void main(void){ gl_Position = vec4(position.xy, 0.99995, 1.0); }`;
BABYLON.Effect.ShadersStore['bgFragmentShader'] = `
precision highp float;
uniform vec3 cBg;   // flat background colour
uniform float focusAmt;   // O: fade the background to grayscale too
uniform float focusDark;  // …and darken it with the environment
void main(void){ vec3 c = cBg;
  if(focusAmt > 0.001){ float g = dot(c, vec3(0.299, 0.587, 0.114)); c = mix(c, vec3(g) * (1.0 - focusDark), focusAmt); }
  gl_FragColor = vec4(c, 1.0); }`;

/* Global brightness post-process (dev "lighting" slider). Multiplies the finished frame — the atom
   shaders light themselves, so there is no Babylon light to turn up; this is the safe global lever. */
BABYLON.Effect.ShadersStore['brightPixelShader'] = `
precision highp float;
varying vec2 vUV;
uniform sampler2D textureSampler;
uniform float bright;
uniform float contrast;
uniform float sat;      // 0 = greyscale, 1 = untouched, >1 = punchier
uniform float hi;       // -1..1 on the bright end only
uniform float sh;       // -1..1 on the dark end only
void main(void){ vec4 t = texture2D(textureSampler, vUV);
  vec3 c = (t.rgb - 0.5) * contrast + 0.5;   // contrast around mid-grey — raised as it dims so it does not wash out
  c *= bright;                                // then the overall level
  float luma = dot(c, vec3(0.299, 0.587, 0.114));
  c = mix(vec3(luma), c, sat);                // saturation, pivoting on luminance so brightness is unchanged
  // Highlights and shadows are weighted by luminance, so each end moves on its own and the midtones
  // stay put. Both are gains rather than offsets, which keeps neutral at exactly 0.
  c *= 1.0 + hi * smoothstep(0.5, 1.0, luma);
  c *= 1.0 + sh * (1.0 - smoothstep(0.0, 0.5, luma));
  gl_FragColor = vec4(clamp(c, 0.0, 1.0), t.a); }`;

let engine = null;

/* ── Fetch + parse + build a mol2 file, then render it ─────────────────── */
async function run(){
  /* ── Thylakoid membrane scene ─────────────────────────────────────────────
     Integral complexes are embedded in the bilayer (Y≈0) in electron-transport order
     along X; soluble partners sit on the stroma (+Y) or lumen (−Y) face beside their
     functional partner. x = position along the membrane, y = 0 membrane / + stroma /
     − lumen, z = depth into the membrane plane. */
  const MEMBRANE_Y = 0;
  // Filenames now match their content, but complexes are still identified by their INTERNAL name /
  // PDB-or-AlphaFold code (robust regardless of filename).
  // x = along the membrane, y = 0 membrane / + stroma / − lumen, z = depth into the plane.
  const MODELS = [
    {match:'3jcu',   x:-560, y:0,    z:0,    rot:[54,-171,-180], label:'Photosystem II'},
    {match:'7r0w',   x:-221, y:8,    z:11,   rot:[-62,-38,102], label:'Cytochrome b6f'},
    {match:'9e0j',   x:460,  y:0,    z:0,    rot:[-77,132,-130], label:'Photosystem I'},
    {match:'6l7o',   x:97,   y:35,   z:30,   rot:[51,-159,70],   label:'NDH-1'},
    {match:'6vm1',   x:760,  y:84,   z:0,    rot:[-69,102,33],   label:'ATP synthase'},
    {match:'1ag6',   x:-10,  y:-190, z:0,    label:'Plastocyanin'},
    {match:'q39249', x:-600, y:-190, z:10,   label:'Violaxanthin de-epoxidase'},
    {match:'1a70',   x:230,  y:250,  z:20,   label:'Ferredoxin'},
    {match:'1gjr',   x:400,  y:290,  z:80,   label:'FNR'},
    {match:'1rcx',   x:600,  y:380,  z:-80,  label:'RuBisCO'},
    {match:'q9sl05', x:-40,  y:220,  z:90,   label:'PGR5'},
    {match:'q8h112', x:30,   y:185,  z:-90,  label:'PGRL1'},
    {match:'q9s713', x:-360, y:230,  z:90,   label:'STN7'},
    {match:'4yzg',   x:-470, y:220,  z:-80,  label:'PPH1'},
    {match:'q9fgc7', x:-640, y:230,  z:0,    label:'Zeaxanthin epoxidase'},
    {match:'chlorophyll', x:-560, y:150, z:130, label:'Chlorophyll'},   // one CLA plucked from PSII → its own file
    {match:'plastoquinone', x:-495, y:150, z:135, label:'Plastoquinone'},   // one PL9 plucked from cytb6f → its own file, beside the lone chlorophyll
    {match:'nadph', x:-425, y:150, z:135, label:'NADPH'},   // one NADP+ plucked from FNR → its own file, beside the chlorophyll + quinone (coloured pink)
  ];
  const FILES = ['PSII.mol2','photosystem_I.mol2','cytochrome_b6f.mol2','ATP_synthase.mol2','NDH-1.mol2',
    'ferredoxin.mol2','FNR.mol2','RuBisCO.mol2','plastocyanin.mol2','PGR5.mol2',
    'PGRL1.mol2','PPH1.mol2','STN7.mol2','Violaxanthin_de-epoxidase.mol2','Zeaxanthin_epoxidase.mol2','chlorophyll.mol2','quinone.mol2','nadph.mol2'];
  setLbl('Haetaan tylakoidimalleja…');
  const mols = [];
  for(let i=0;i<FILES.length;i++){ const fn=FILES[i];
    setLbl(`Haetaan ${fn}…`); setBar((i/FILES.length)*28);
    try{
      const res = await fetch('./'+fn);
      if(!res.ok){ console.warn('skip (HTTP '+res.status+')', fn); continue; }
      const ab = await res.arrayBuffer();
      const parsed = parseMol2(new TextDecoder().decode(new Uint8Array(ab)));
      for(const m of parsed){ if(m.na<=0) continue;
        const nm = (m.name||'').toLowerCase();
        const cfg = MODELS.find(e => !e._used && nm.includes(e.match));   // match by internal name/code
        if(!cfg){ console.log('unmatched molecule "'+m.name+'" in '+fn+' (skipped)'); continue; }
        cfg._used = true; cfg.file = fn; m.cfg = cfg; m.name = cfg.label;
        markTyrZ(m);                                   // tag the OEC-adjacent tyrosine as Tyr Z (needs raw, pre-transform coords)
        mols.push(m); }
    }catch(err){ console.warn('failed to load', fn, err); }
    await yield_();
  }
  if(mols.length === 0) throw new Error('No models loaded — are the .mol2 files next to index.html?');
  setLbl('Sijoitellaan komplekseja…'); setBar(0.32); await yield_();
  const psii = mols.find(m => m.cfg && m.cfg.match==='3jcu') || mols[0];
  const chl = null;   // chlorophyll is now a normal model (chlorophyll.mol2), not a runtime-extracted showcase — every `if(chl)`/`m===chl` guard below no-ops
  // A REALISTIC thylakoid lipid mixture rather than one species tiled everywhere. Weights are the
  // measured composition of plant thylakoids — the galactolipids dominate, the two anionic lipids
  // are minor, and PG is the only phosphate-bearing head group in the sheet.
  const LIPID_MIX = [ {code:1, name:'MGDG', w:50}, {code:2, name:'DGDG', w:30},
                      {code:3, name:'SQDG', w:10}, {code:4, name:'PG',   w:10} ];
  const lipids = [];
  for(const L of LIPID_MIX){ const g = extractLipid(psii, L.code); if(g){ g.lname=L.name; g.w=L.w; lipids.push(g); } }
  if(!lipids.length){ const g = extractLipid(psii); if(g){ g.lname='lipid'; g.w=1; lipids.push(g); } }   // fallback: old single-lipid behaviour

  // Rotate every model 90° about Z (as before) so complexes stand upright-ish across the membrane.
  for(const m of mols){ for(let k=0;k<m.na;k++){ const x=m.x[k], y=m.y[k]; m.x[k]=y; m.y[k]=-x; } }
  if(chl){ for(let k=0;k<chl.na;k++){ const x=chl.x[k], y=chl.y[k]; chl.x[k]=y; chl.y[k]=-x; }
    chl.cfg = {x:-560, y:150, z:130}; chl.name = 'Chlorophyll'; mols.push(chl); }

  // Cytochrome b6f (7r0w) is already the physiological HOMODIMER in the file — no clone needed.

  // Bake per-model rotation (Euler degrees rx,ry,rz read off the gizmo label) around each model's
  // centroid, so the orientation persists. Uses Babylon's YawPitchRoll(y,x,z) — the inverse of
  // the label's toEulerAngles(), so the numbers reproduce exactly.
  { const D = Math.PI/180, _R = new BABYLON.Matrix(), _v = new BABYLON.Vector3();
    for(const m of mols){ const rot = m.cfg && m.cfg.rot; if(!rot) continue;
      BABYLON.Quaternion.RotationYawPitchRoll(rot[1]*D, rot[0]*D, rot[2]*D).toRotationMatrix(_R);
      let cx=0,cy=0,cz=0; for(let k=0;k<m.na;k++){ cx+=m.x[k]; cy+=m.y[k]; cz+=m.z[k]; } cx/=m.na; cy/=m.na; cz/=m.na;
      for(let k=0;k<m.na;k++){ _v.set(m.x[k]-cx, m.y[k]-cy, m.z[k]-cz);
        const w = BABYLON.Vector3.TransformCoordinates(_v, _R);
        m.x[k]=w.x+cx; m.y[k]=w.y+cy; m.z[k]=w.z+cz; } } }

  // Centre each model, then offset it to its target membrane position.
  const box = [];
  for(const m of mols){
    let miX=Infinity,miY=Infinity,miZ=Infinity,maX=-Infinity,maY=-Infinity,maZ=-Infinity;
    for(let k=0;k<m.na;k++){ const x=m.x[k],y=m.y[k],z=m.z[k];
      if(x<miX)miX=x; if(y<miY)miY=y; if(z<miZ)miZ=z; if(x>maX)maX=x; if(y>maY)maY=y; if(z>maZ)maZ=z; }
    box.push({miX,miY,miZ,maX,maY,maZ,w:maX-miX});
    const cx=(miX+maX)/2, cy=(miY+maY)/2, cz=(miZ+maZ)/2, cfg=m.cfg||{x:0,y:0,z:0};
    m.ox = cfg.x - cx; m.oy = (cfg.y + MEMBRANE_Y) - cy; m.oz = cfg.z - cz;
  }
  // Per-model world bounding boxes → tag every cell instance with its model so complexes can be
  // dragged independently (a per-model offset the shaders apply). Chlorophyll is not draggable.
  const mInfo = mols.map((m,mi) => { const b=box[mi]; return { mi, name:m.name||('model'+mi), isChl:(m===chl),
    x0:b.miX+m.ox, x1:b.maX+m.ox, y0:b.miY+m.oy, y1:b.maY+m.oy, z0:b.miZ+m.oz, z1:b.maZ+m.oz,
    cx:(b.miX+b.maX)/2+m.ox, cy:(b.miY+b.maY)/2+m.oy, cz:(b.miZ+b.maZ)/2+m.oz,
    vol:(b.maX-b.miX+1)*(b.maY-b.miY+1)*(b.maZ-b.miZ+1) }; });
  const modelOf = (x,y,z) => {   // smallest bbox containing the point wins; else nearest centre
    let best=-1, bestVol=Infinity;
    for(const mi of mInfo){ if(mi.isChl) continue;
      if(x>=mi.x0&&x<=mi.x1&&y>=mi.y0&&y<=mi.y1&&z>=mi.z0&&z<=mi.z1 && mi.vol<bestVol){ best=mi.mi; bestVol=mi.vol; } }
    if(best>=0) return best;
    let nd=Infinity, nb=0; for(const mi of mInfo){ if(mi.isChl) continue; const dx=x-mi.cx,dy=y-mi.cy,dz=z-mi.cz,d=dx*dx+dy*dy+dz*dz; if(d<nd){nd=d;nb=mi.mi;} }
    return nb;
  };
  // Membrane must span the embedded (integral) complexes → its centre + half-extent.
  const integ = MODELS.filter(c => c.y===0);
  let iMinX=Infinity,iMaxX=-Infinity,iMinZ=Infinity,iMaxZ=-Infinity;
  for(const c of integ){ iMinX=Math.min(iMinX,c.x); iMaxX=Math.max(iMaxX,c.x); iMinZ=Math.min(iMinZ,c.z); iMaxZ=Math.max(iMaxZ,c.z); }
  const memCenX = (iMinX+iMaxX)/2, memCenZ = (iMinZ+iMaxZ)/2;
  const memHalfX = (iMaxX-iMinX)/2 + 900, memHalfZ = 620;   // huge sheet extending well past the complexes → far edge fogs out toward the horizon

  /* Count atoms + bond-halves per element (for typed-array sizing) */
  const nEl = EL_LIST.length;
  let gSpawnPlaneZ = 0, gSpawnBounds = null;   // fixed z-plane + x/y bounds where hand-spawned atoms live (set with the inner box)
  const atomCount = new Uint32Array(nEl), halfCount = new Uint32Array(nEl);
  for(const m of mols){
    if(m===chl) continue;   // chlorophyll is rendered separately (animated), not in the static build
    for(let k=0;k<m.na;k++) atomCount[m.el[k]]++;
    for(let k=0;k<m.nb;k++){
      const a1=m.b1[k], a2=m.b2[k];
      if(a1<0||a1>=m.na||a2<0||a2>=m.na) continue;
      const bo=m.bo[k]||1, hc=2*bo;   // σ (1) + its small back-knob (1) + π (2 lobes each: above & below)
      halfCount[m.el[a1]]+=hc; halfCount[m.el[a2]]+=hc;
    }
  }

  /* Engine/scene */
  const canvas = document.getElementById('c');
  // WebGL2 engine. WebGPU was removed: the custom impostor / hand-written frag-depth shaders render
  // invisible on WebGPU, so it was never usable here.
  const gBackend = 'WebGL';
  /* powerPreference asks the browser for the discrete GPU on a hybrid laptop. Keep it, but know what it
     is worth: on this machine, with an RTX 4080 beside an Intel UHD, it made no difference on its own —
     Chromium picks ONE adapter when its GPU process starts and shares it across every tab, so a page
     cannot move a process that is already running. Even a fresh instance with --force_high_performance_gpu
     still came up on the Intel. What actually settled it was the machine: Legion dGPU/MUX mode and the
     power profile. This is the correct thing to ask for and costs nothing, but it is not the lever. */
  engine = new BABYLON.Engine(canvas, true, {stencil:true, powerPreference:'high-performance'});   // stencil → nucleus shows through its OWN orbitals but is hidden by others
  /* A browser that has fallen back to a software rasteriser looks identical and is simply slow, so
     make it readable rather than something to infer from frame times. */
  let gRenderer = '?';
  try { const g = engine._gl; const dbg = g.getExtension('WEBGL_debug_renderer_info');
    gRenderer = String(g.getParameter(dbg ? dbg.UNMASKED_RENDERER_WEBGL : g.RENDERER) || '?');
  } catch(_){}
  const gSoftware = /llvmpipe|softpipe|swiftshader|software|basic render|generic render/i.test(gRenderer);
  /* ALWAYS show which card is drawing. Which GPU the browser picked is the single most useful thing to
     know when the page is slow - a whole day went into chasing a stutter that turned out to be the
     integrated chip - and it was only visible in dev mode, which is exactly when you are not looking.
     Green for a discrete card, amber for anything else, so it reads at a glance without being read. */
  { const el = document.createElement('div');
    const dgpu = /nvidia|geforce|rtx|radeon|rx |arc |quadro/i.test(gRenderer) && !gSoftware;
    const short = (gRenderer.match(/(NVIDIA GeForce [^,(]*|Radeon[^,(]*|Intel\(R\) [^,(]*|Arc[^,(]*|Apple M[0-9][^,(]*)/i) || [gRenderer])[0].trim();
    el.textContent = short.slice(0, 44) || '?';
    el.title = gRenderer;
    el.style.cssText = 'position:fixed;right:8px;bottom:6px;z-index:24;pointer-events:none;'
      + 'font:11px ui-monospace,SFMono-Regular,Menlo,monospace;padding:2px 7px;border-radius:6px;'
      + 'background:rgba(24,28,20,.55);border:1px solid rgba(255,255,255,.18);'
      + 'color:' + (dgpu ? '#9ede7a' : '#f0c060') + ';';
    document.body.appendChild(el); }
  engine.enableOfflineSupport = false;   // perf: skip the .manifest network probe per scene file
  // Supersample: render at higher internal res so the shader-drawn sphere edges /
  // ink outlines are anti-aliased (no FXAA). hardwareScalingLevel < 1 = higher res.
  // Start ~1.5× above device pixels, capped at 2.5× linear; adaptive backoff below.
  /* hardwareScalingLevel is a LINEAR divisor, so cost is its square: at 0.4 the scene draws 6.25× the
     window's pixels and every full-screen post-process allocates a target that size. Derived from
     devicePixelRatio alone it was unbounded — dpr is read ONCE at load and changes with browser zoom and
     with which monitor the window is on, so the same file could render 2.2× or 6.2× the pixels between
     two loads, and a maximised window on a scaled 4K display asked for 8640×4500, past the 8192 that
     MAX_RENDERBUFFER_SIZE commonly reports (targets then fail to allocate and the canvas goes black). */
  const SS_MIN = 0.4, SS_MAX = 1.6;                     // floor = max supersample (2.5× linear)
  const PIX_BUDGET = 4.0e6;                             // pixels per full-screen pass, whatever the window size
  let gMaxDim = 8192;
  try { const g = engine._gl;
    gMaxDim = Math.min(g.getParameter(g.MAX_RENDERBUFFER_SIZE), g.getParameter(g.MAX_TEXTURE_SIZE)) || 8192;

    }

    for(let k=0;k<m.na;k++) bd[k] = [];

      if(a1<0||a1>=m.na||a2<0||a2>=m.na) continue;

        let maxd=0, R=0; for(let i=0;i<6;i++){ const dx=m.x[path[i]]-cx,dy=m.y[path[i]]-cy,dz=m.z[path[i]]-cz;

    for(let a=0;a<nA;a++) start[a+1]+=start[a];
    const list = new Int32Array(nL), cur = start.slice(0, nA);

  const BUBBLE_R = 49.5;      // camera reveal-sphere radius (Å) — atoms within it go translucent
  let gWaveT = 0;             // global thermal-shake clock (bound as uT in every atom shader)
  let gSpeed = 1;             // master speed (wiggle + camera), driven by the bottom-left slider
  let gPaused = false;        // space bar: everything gSpeed drives stops dead and resumes where it left off
  let gApplySpeed = () => {};  // set by the speed slider below, so the space bar can re-apply it
  let gBright = 0.63;         // global brightness multiplier (dev "lighting" slider → brightness post-process)
  let gZoomPull = 1.0;        // how far the view slides toward the cursor when wheel-zooming (0 = straight in, 1 = cursor stays pinned). Dev slider.
  let gSat = 1.66;            // saturation, dev slider

    for(let e=0;e<nEl;e++){
      if(atomCount[e]===0) continue;
      const sb=sphBuf[e], A=info(e).n, ec=info(e).c, nb=nucBuf[e], nc=nucColBuf[e];
      for(let a=0;a<atomCount[e];a++){
        const c=getCell(cellIx(sb[a*16+12],sb[a*16+13],sb[a*16+14]));
        for(let j=0;j<A;j++){ pushN(c.nucM, nb, (a*A+j)*16, 16); pushN(c.nucC, nc, (a*A+j)*4, 4); }
      }
      const oc=orbCount(e);   // Orbitals — bin by orbCenBuf (each lobe's atom centre).
      if(oc>0){ const ob=orbBuf[e], ocol=orbColBuf[e], ocen=orbCenBuf[e], oidb=orbIdBuf[e], tot=atomCount[e]*oc;
        for(let i=0;i<tot;i++){ const o=i*16;
          if(ob[o]*ob[o]+ob[o+1]*ob[o+1]+ob[o+2]*ob[o+2] < 1e-9) continue;   // skipped (bond-doubled) lobe → don't upload it
          const c=getCell(cellIx(ocen[i*3],ocen[i*3+1],ocen[i*3+2]));
          pushN(c.orbM, ob, o, 16); pushN(c.orbCol, ocol, i*3, 3); pushN(c.orbCen, ocen, i*3, 3); c.orbOid.push(oidb[i]);
        }
      }
      { const cen=cenBuf[e];   // Bonding lobes.
        for(let i=0;i<cylIdx[e];i++){ const c=getCell(cellIx(cen[i*3],cen[i*3+1],cen[i*3+2]));
          pushN(c.boM, cylBuf[e], i*16, 16); c.boT.push(wBuf[e][i]); pushN(c.boCen, cen, i*3, 3);
          c.boCol.push(ec[0],ec[1],ec[2]); c.boOid.push(cylOidBuf[e][i]);
        } }
      { const cen=lpCenBuf[e];   // Lone-pair lobes.
        for(let i=0;i<lpIdx[e];i++){ const c=getCell(cellIx(cen[i*3],cen[i*3+1],cen[i*3+2]));
          pushN(c.lpM, lpBuf[e], i*16, 16); c.lpT.push(1.0); pushN(c.lpCen, cen, i*3, 3);
          c.lpCol.push(ec[0],ec[1],ec[2]); c.lpOid.push(lpOidBuf[e][i]);
        } }

    }
    for(const [k,c] of cells){
      let entry = macroCellByKey.get(k);
      if(!entry){   // a lobe centre landed in a cell with no atom sphere (rare, at cell borders) → fresh entry
        const ix=Math.floor(k/(gny*gnz)), iy=Math.floor((k%(gny*gnz))/gnz), iz=k%gnz;
        const cx=bMiX+(ix+0.5)*CELL, cy=bMiY+(iy+0.5)*CELL, cz=bMiZ+(iz+0.5)*CELL;
        entry = { cx,cy,cz, mi:modelOf(cx,cy,cz), meshes:[], nuc:null, sphere:null, macro:true, r:cellHalfDiag, visOn:false, nucOn:false, sphOn:false, k };
        macroCellByKey.set(k, entry); cellList.push(entry);

      if(c.nucM.length){ const m=BABYLON.MeshBuilder.CreatePlane('cn'+k,{size:2},scene); m.material=nucMatG; m.isPickable=false;

        m.thinInstanceSetBuffer('modelId', mdlBuf(c.nucM),1,true);

        m.alwaysSelectAsActiveMesh=true; m.setEnabled(false); entry.nuc=m; }
      if(c.orbM.length){ const m=BABYLON.MeshBuilder.CreateSphere('co'+k,{segments:3,diameter:1},scene); m.material=orbMatG; m.isPickable=false;
        m.thinInstanceSetBuffer('matrix', new Float32Array(c.orbM),16,true); m.thinInstanceSetBuffer('ocol', new Float32Array(c.orbCol),3,true);
        m.thinInstanceSetBuffer('ocen', new Float32Array(c.orbCen),3,true); m.thinInstanceSetBuffer('oid', new Float32Array(c.orbOid),1,true);
        m.thinInstanceSetBuffer('modelId', mdlBuf(c.orbM),1,true);
        m.alwaysSelectAsActiveMesh=true; m.setEnabled(false); entry.meshes.push(m); }
      if(c.boM.length){ const m=BABYLON.MeshBuilder.CreateSphere('cb'+k,{segments:3,diameter:1},scene); m.material=bondBondingMat; m.isPickable=false;
        m.thinInstanceSetBuffer('matrix', new Float32Array(c.boM),16,true); m.thinInstanceSetBuffer('taper', new Float32Array(c.boT),1,true);
        m.thinInstanceSetBuffer('ocen', new Float32Array(c.boCen),3,true); m.thinInstanceSetBuffer('bcol', new Float32Array(c.boCol),3,true); m.thinInstanceSetBuffer('oid', new Float32Array(c.boOid),1,true);
        m.thinInstanceSetBuffer('modelId', mdlBuf(c.boM),1,true);
        m.alwaysSelectAsActiveMesh=true; m.setEnabled(false); entry.meshes.push(m); }
      if(c.lpM.length){ const m=BABYLON.MeshBuilder.CreateSphere('cl'+k,{segments:3,diameter:1},scene); m.material=bondLPMat; m.isPickable=false;
        m.thinInstanceSetBuffer('matrix', new Float32Array(c.lpM),16,true); m.thinInstanceSetBuffer('taper', new Float32Array(c.lpT),1,true);
        m.thinInstanceSetBuffer('ocen', new Float32Array(c.lpCen),3,true); m.thinInstanceSetBuffer('bcol', new Float32Array(c.lpCol),3,true); m.thinInstanceSetBuffer('oid', new Float32Array(c.lpOid),1,true);
        m.thinInstanceSetBuffer('modelId', mdlBuf(c.lpM),1,true);
        m.alwaysSelectAsActiveMesh=true; m.setEnabled(false); entry.meshes.push(m); }

    for(const entry of cellList){ if(entry.macro){ entry.visOn=-1; entry.nucOn=-1; } }
    cells.clear();
    for(let e=0;e<nEl;e++){ nucBuf[e]=nucColBuf[e]=orbCenBuf[e]=null; }   // free the per-element core buffers now baked into cells (keep orbBuf/orbColBuf + cylBuf/cenBuf/wBuf + lpBuf/lpCenBuf → the hover outline matches every fill lobe)
  };

  /* No vdW shells: every atom always shows its full orbitals (no space-filling stand-in, no
     screen-door reveal band). Orbitals render for cells near the camera; far cells simply aren't
     drawn (rather than falling back to a vdW sphere). */

  /* ── Per-protein collision shells ────────────────────────────────────────────────────────────────
     A real shape derived from the spatial data, not a bounding box. Every atom is bucketed by its
     DIRECTION from the model centroid, and each bucket keeps the furthest point that atom's vdW sphere
     reaches. That is one pass over the atoms per model, and it leaves a spherical height-field: a radius
     per direction that touches the outermost atom on that bearing — the surface atoms, connected.
     Empty buckets (bearings no atom happened to fall on) are filled from their neighbours, then one
     dilation pass guarantees the shell never cuts inside an atom it is meant to contain.
     Star-shaped, so a deep concavity is bridged rather than followed — the usual trade for a collision
     proxy, and it stays a closed watertight surface. Dev-only. */
  const gHulls = [];
  const gProtSlab = [];   // per model: true = far enough that its atoms are replaced by the hull
  let gProtSlabPx = 130;  // a complex drops to its hull once it covers fewer than this many pixels
  const SH_LAT = 32, SH_LON = 64;   // ~5.6 deg bearings
  {
    const NLAT = SH_LAT, NLON = SH_LON;
    const hullMat = new BABYLON.StandardMaterial('hullMat', scene);
    hullMat.wireframe = true; hullMat.disableLighting = true; hullMat.backFaceCulling = false;
    hullMat.emissiveColor = new BABYLON.Color3(0.25, 0.95, 0.55); hullMat.alpha = 0.55;
    for(let mi=0; mi<mols.length; mi++){
      const m = mols[mi];
      if(!m || !m.na || m === chl) continue;
      const ox=m.ox||0, oy=m.oy||0, oz=m.oz||0;
      let cx=0, cy=0, cz=0;
      for(let k=0;k<m.na;k++){ cx+=m.x[k]; cy+=m.y[k]; cz+=m.z[k]; }
      cx=cx/m.na+ox; cy=cy/m.na+oy; cz=cz/m.na+oz;
      const R = new Float32Array(NLAT*NLON);
      /* Splat every atom into ALL the bearings its vdW sphere actually subtends, taking the exact
         ray-sphere exit distance along each one. The previous version raised only the single bearing
         bucket the atom's centre landed in, then max-dilated over a 5x5 bucket window to cover the
         surface in between. That window spans about 11 degrees, so a single far tip of an elongated
         complex raised every bearing within 11 degrees of it to the tip's own reach - the shell
         ballooned outward into a star several times the size of the protein. Subtending the cone
         properly is the same order of work (a buried atom subtends a few degrees, so it touches a
         handful of bearings) and the shell hugs the atoms instead. */
      for(let k=0;k<m.na;k++){
        const dx=m.x[k]+ox-cx, dy=m.y[k]+oy-cy, dz=m.z[k]+oz-cz;
        const a = info(m.el[k]).vr*FILL_SCALE;
        const r = Math.hypot(dx,dy,dz);
        const phiP = (r<1e-9) ? 0 : Math.acos(Math.max(-1, Math.min(1, dz/r)));
        const thP  = Math.atan2(dy,dx), sPhiP = Math.sin(phiP);
        const ang  = (r <= a) ? Math.PI : Math.asin(Math.min(1, a/r));   // half-angle this atom subtends
        const cAng = Math.cos(ang), rr_aa = r*r - a*a;
        const liC  = phiP/Math.PI*(NLAT-1), dLat = Math.ceil(ang/Math.PI*(NLAT-1)) + 1;
        const l0 = Math.max(0, Math.floor(liC-dLat)), l1 = Math.min(NLAT-1, Math.ceil(liC+dLat));
        for(let li=l0; li<=l1; li++){
          const phi = li/(NLAT-1)*Math.PI, sp=Math.sin(phi), cpv=Math.cos(phi);
          let loLo=0, loHi=NLON-1;
          if(sp > 1e-6 && sPhiP > 1e-6){
            const cosD = (cAng - Math.cos(phiP)*cpv) / (sPhiP*sp);       // longitudes within `ang` at this latitude
            if(cosD > 1) continue;                                       // this latitude ring misses the atom entirely
            if(cosD > -1){ const half = Math.ceil(Math.acos(cosD)/(2*Math.PI)*NLON) + 1;
              const c0 = Math.round((thP+Math.PI)/(2*Math.PI)*NLON); loLo = c0-half; loHi = c0+half; }
          }
          for(let lo=loLo; lo<=loHi; lo++){
            const b2=((lo%NLON)+NLON)%NLON, theta = b2/NLON*2*Math.PI - Math.PI;
            const b = sp*Math.cos(theta)*dx + sp*Math.sin(theta)*dy + cpv*dz;
            const disc = b*b - rr_aa; if(disc < 0) continue;             // this bearing misses the atom
            const t = b + Math.sqrt(disc), q = li*NLON+b2;
            if(t > R[q]) R[q] = t;
          }
        }
      }
      /* Close PINHOLES only - a bearing with no atom that is surrounded by bearings that have one -
         and never bridge a real gap. The old fill ran six passes taking the MAX of any neighbour, so a
         bearing that genuinely pointed through empty space (a crescent's hollow, the gap between two
         lobes) inherited the reach of whatever was next to it, pass after pass, until the whole complex
         was wrapped in a ball. One complex came out with a minimum radius of 26 units where the others
         reach 0-7, and its slab drew as a sphere beside the atoms. Now a bearing is filled only when at
         least six of its eight neighbours are, with the SMALLEST of them, in a single pass. Bearings that
         still miss stay at zero: the shell is simply open there, which is the truth of it. */
      { const F = new Float32Array(R);
        for(let li=0; li<NLAT; li++) for(let lo=0; lo<NLON; lo++){
          const q=li*NLON+lo; if(R[q]>0) continue;
          let cnt=0, small=Infinity;
          for(let dl=-1; dl<=1; dl++) for(let dn=-1; dn<=1; dn++){
            if(!dl && !dn) continue;
            const a=li+dl; if(a<0||a>=NLAT) continue;
            const b=((lo+dn)%NLON+NLON)%NLON;

        }
        R.set(F); }
      // The mesh interpolates linearly BETWEEN bearings, so its surface sags a little inside the true
      // hull in the gaps. Half a bearing step is 2.8 degrees, worth about 0.1% - 1.5% covers it with
      // room to spare, against the several hundred percent the old 5x5 dilate cost.
      const D = new Float32Array(R.length);
      for(let q=0;q<R.length;q++) D[q] = R[q]*1.015;
      // vertices are CENTROID-RELATIVE, so the mesh can simply carry its model's transform
      const pos=[], idx=[];
      for(let li=0; li<NLAT; li++){
        const phi = li/(NLAT-1)*Math.PI, sp=Math.sin(phi), cp=Math.cos(phi);
        for(let lo=0; lo<=NLON; lo++){
          const theta = (lo%NLON)/NLON*2*Math.PI - Math.PI, rr = D[li*NLON+(lo%NLON)];
          pos.push(sp*Math.cos(theta)*rr, sp*Math.sin(theta)*rr, cp*rr);
        }
      }
      const W=NLON+1;
      for(let li=0; li<NLAT-1; li++) for(let lo=0; lo<NLON; lo++){
        const a=li*W+lo, b=a+1, c=a+W, d=c+1;
        idx.push(a,c,b, b,c,d);
      }
      const mesh = new BABYLON.Mesh('hull'+mi, scene);
      const vd = new BABYLON.VertexData(); vd.positions = pos; vd.indices = idx;
      vd.normals = []; BABYLON.VertexData.ComputeNormals(pos, idx, vd.normals);
      vd.applyToMesh(mesh);
      mesh.material = hullMat; mesh.isPickable = false; mesh.alwaysSelectAsActiveMesh = true;
      mesh.setEnabled(false);
      let maxR = 0; for(let q=0;q<D.length;q++) if(D[q] > maxR) maxR = D[q];
      /* MEGACHEAP PROTEIN. The same hull, filled rather than wireframed, stands in for the complex once
         it is far enough away: one low-poly star-shaped mesh of about 2000 vertices instead of tens of
         thousands of ray-traced impostors. It is crude - it is the atoms' outer envelope with the
         surface detail flattened out - but at that distance the complex is a coloured blob anyway. It
         costs nothing to build because the collision shell already had to compute this exact shape. */
      const slab = mesh.clone('hullSlab'+mi);
      const sMat = new BABYLON.StandardMaterial('hullSlabMat'+mi, scene);
      sMat.diffuseColor = new BABYLON.Color3(0,0,0); sMat.disableLighting = true; sMat.backFaceCulling = true;
      slab.material = sMat; slab.isPickable = false; slab.alwaysSelectAsActiveMesh = true; slab.setEnabled(false);

    }
    // carry each shell on its model's transform, so a dragged or flattened model keeps its shell
    const _hp=new BABYLON.Vector3(), _hq=new BABYLON.Quaternion(), _hs=new BABYLON.Vector3(), _hm=new BABYLON.Matrix();
    scene.onBeforeRenderObservable.add(()=>{
      if(!gHulls.length) return;
      let anyOn = false;
      for(const h of gHulls) if(h.mesh.isEnabled() || h.slab.isEnabled()){ anyOn = true; break; }
      if(!anyOn) return;
      for(const h of gHulls){
        BABYLON.Matrix.FromArrayToRef(gModelXform, h.mi*16, _hm);
        _hm.decompose(_hs, _hq, _hp);
        const c=BABYLON.Vector3.TransformCoordinates(h.c, _hm);
        for(const m of [h.mesh, h.slab]){
          m.position.copyFrom(c);
          if(!m.rotationQuaternion) m.rotationQuaternion = new BABYLON.Quaternion();
          m.rotationQuaternion.copyFrom(_hq);
          m.scaling.copyFrom(_hs);
        }
      }
